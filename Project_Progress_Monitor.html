<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Progress Monitor — S-Curve &amp; Schedule Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260923a"></script>
<script src="auth-session.js?v=20260923a"></script>
<script src="team-routing.js?v=20260923a"></script>
<script src="table-nav.js?v=20260923a"></script>
<script src="pdf-preview.js?v=20260923a"></script>
<style>
:root{
  --navy:#0f2a5c;--navy-2:#1e3a8a;--pri:#2563eb;--pri-soft:#eff6ff;--pri-bdr:#bfdbfe;
  --bg:#f1f5f9;--card:#ffffff;--bdr:#e2e8f0;--bdr-2:#cbd5e1;--txt:#0f172a;--txt-2:#475569;--txt-3:#94a3b8;
  --ok:#16a34a;--ok-soft:#dcfce7;--warn:#d97706;--warn-soft:#fef3c7;--ng:#dc2626;--ng-soft:#fee2e2;
  --add:#ea580c;--add-soft:#ffedd5;--crit:#dc2626;--base:#94a3b8;--fc:#f59e0b;--sum:#334155;
  --radius:12px;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:var(--pri)}

/* ---------- top bar ---------- */
.topbar{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .back{color:#cbd5e1;text-decoration:none;font-size:13px;white-space:nowrap}
.topbar .ttl{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.topbar .ttl small{display:block;font-weight:500;font-size:11px;color:#bfdbfe;letter-spacing:.3px}
.topbar .grow{flex:1}
.proj-btn{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:700;background:rgba(255,255,255,.2)!important}
.topbar select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 8px;max-width:260px}
.topbar select option{color:#0f172a}
.tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.22)}
.cloud-pill{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap;cursor:pointer}
.cloud-pill.ok{background:rgba(34,197,94,.25)}.cloud-pill.err{background:rgba(239,68,68,.35)}.cloud-pill.busy{background:rgba(245,158,11,.3)}

/* ---------- project strip ---------- */
.pstrip{background:#fff;border-bottom:1px solid var(--bdr);padding:10px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pstrip .pname{font-size:18px;font-weight:800}
.pstrip .pmeta{color:var(--txt-2);font-size:12px}
.dd-chip{display:flex;align-items:center;gap:6px;background:var(--pri-soft);border:1px solid var(--pri-bdr);border-radius:10px;padding:5px 10px;font-size:12px}
.dd-chip b{color:var(--navy-2)}
.dd-chip input,.dd-chip select{border:1px solid var(--pri-bdr);border-radius:6px;padding:2px 5px;background:#fff;font-size:12px}
.status-badge{font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;letter-spacing:.3px}
.st-ok{background:var(--ok-soft);color:#166534}.st-warn{background:var(--warn-soft);color:#92400e}.st-ng{background:var(--ng-soft);color:#991b1b}.st-na{background:#e2e8f0;color:#334155}.st-done{background:#dbeafe;color:#1e40af}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:0 14px;background:#fff;border-bottom:1px solid var(--bdr);overflow-x:auto;position:sticky;top:52px;z-index:30}
.tab{padding:11px 13px;border:none;background:none;cursor:pointer;color:var(--txt-2);font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.tab .cnt{background:var(--ng);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:4px}
main{padding:16px 18px 60px;width:100%}
.fill-h{max-height:max(420px,calc(100vh - 290px))}
.panel{display:none}.panel.active{display:block}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-weight:500;color:var(--txt-3);font-size:12px}
.card h3 .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k{font-size:11px;color:var(--txt-2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--txt-3);margin-top:2px}
.kpi.big .v{font-size:30px}
.kpi .bar{height:6px;border-radius:4px;background:#e2e8f0;margin-top:8px;position:relative;overflow:hidden}
.kpi .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.kpi .bar i.p{background:rgba(37,99,235,.35)}.kpi .bar i.a{background:var(--ok);height:6px}
.pos{color:var(--ok)}.neg{color:var(--ng)}.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}

/* ---------- buttons / inputs ---------- */
.btn{border:1px solid var(--bdr-2);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f8fafc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn-pri:hover{background:#1d4ed8}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{background:#15803d}
.btn-ng{color:var(--ng);border-color:#fecaca}.btn-ng:hover{background:var(--ng-soft)}
.btn-add{color:var(--add);border-color:#fed7aa}.btn-add:hover{background:var(--add-soft)}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-xs{padding:1px 6px;font-size:11px;border-radius:6px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sep{width:1px;height:22px;background:var(--bdr-2);margin:0 4px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;font-weight:700;color:var(--txt-2);text-transform:uppercase;letter-spacing:.3px}
.inp,select.inp,textarea.inp{border:1px solid var(--bdr-2);border-radius:8px;padding:7px 9px;background:#fff;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--pri-bdr);border-color:var(--pri)}
textarea.inp{resize:vertical;min-height:60px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hint{font-size:12px;color:var(--txt-3)}
.note{background:var(--pri-soft);border:1px solid var(--pri-bdr);border-radius:10px;padding:9px 12px;font-size:12.5px;color:#1e3a8a;margin-bottom:10px}
.note.warn{background:var(--warn-soft);border-color:#fcd34d;color:#78350f}
.note.ng{background:var(--ng-soft);border-color:#fca5a5;color:#7f1d1d}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#e2e8f0;color:#334155;white-space:nowrap}
.chip.add{background:var(--add-soft);color:#9a3412}.chip.crit{background:var(--ng-soft);color:#991b1b}.chip.ms{background:#ede9fe;color:#5b21b6}
.chip.done{background:#dbeafe;color:#1e40af}.chip.prog{background:var(--ok-soft);color:#166534}.chip.ns{background:#f1f5f9;color:#64748b}
.chip.overdue{background:var(--ng);color:#fff}.chip.behind{background:var(--ng-soft);color:#991b1b}.chip.ahead{background:var(--ok-soft);color:#166534}.chip.ontrack{background:#e0f2fe;color:#075985}.chip.future{background:#f1f5f9;color:#64748b}.chip.lateDone{background:#fef3c7;color:#92400e}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--bdr);border-radius:10px;background:#fff}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{background:#f8fafc;color:var(--txt-2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:8px 8px;border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:2;white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.t tr:hover td{background:#fafcff}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t textarea.ci{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 5px;width:100%;min-width:0;resize:none;overflow:hidden;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;display:block;font:inherit}
table.t textarea.ci:hover{border-color:var(--bdr-2);background:#fff}
table.t textarea.ci:focus{border-color:var(--pri);background:#fff;outline:none}
table.t input.ci,table.t select.ci{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 5px;width:100%;min-width:0}
table.t input.ci:hover,table.t select.ci:hover{border-color:var(--bdr-2);background:#fff}
table.t input.ci:focus,table.t select.ci:focus{border-color:var(--pri);background:#fff;outline:none}
table.t input.ci.num{text-align:right}
#task-table tr.sel td{background:#eff6ff!important}
#task-table tr.sum td{background:#f8fafc;font-weight:700}
#task-table tr.sum.l0 td{background:#eef2f7}
#task-table tr.crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
#task-table tr.added td.nm{box-shadow:inset 3px 0 0 var(--add)}
.nmcell{display:flex;align-items:flex-start;gap:4px;min-width:260px;max-width:560px}
.nmcell .tg,.nmcell .chip,.nmcell .warn-ico{margin-top:5px;flex:none}
.nmcell textarea{flex:1}
.nmcell .tg{width:16px;cursor:pointer;color:var(--txt-3);flex:none;text-align:center;user-select:none}
.mini-bar{position:relative;height:14px;min-width:70px;background:#eef2f7;border-radius:4px;overflow:hidden}
.mini-bar .p{position:absolute;left:0;top:0;bottom:0;background:rgba(37,99,235,.28)}
.mini-bar .a{position:absolute;left:0;top:4px;height:6px;background:var(--ok);border-radius:3px}
.dev-pos{color:var(--ok);font-weight:700}.dev-neg{color:var(--ng);font-weight:700}
.warn-ico{color:var(--warn);cursor:help}

/* ---------- gantt ---------- */
.gantt{display:flex;border:1px solid var(--bdr);border-radius:10px;overflow:hidden;background:#fff}
.g-left{flex:none;width:300px;border-right:1px solid var(--bdr);overflow:hidden}
.g-left .gh{height:44px;background:#f8fafc;border-bottom:1px solid var(--bdr);font-size:11px;font-weight:700;color:var(--txt-2);display:flex;align-items:flex-end;padding:0 8px 6px;text-transform:uppercase}
.g-left .gr{min-height:26px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid #f1f5f9;font-size:12px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.g-left .gr .gn{min-width:0}
.g-left .gr.sum{font-weight:700;background:#f8fafc}
.g-right{flex:1;overflow:auto;position:relative}
.g-right svg{display:block}
@media(max-width:760px){.g-left{width:150px}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(860px,100%);min-width:0;max-width:100%;max-height:none}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bdr)}
.modal .mh b{font-size:15px;color:var(--navy)}
.modal .mh .x{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--txt-3)}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 16px;text-align:center;color:var(--txt-3)}
.empty b{display:block;color:var(--txt-2);font-size:15px;margin-bottom:6px}
.hc-row td:first-child{width:36px}
.pic-bar{height:9px;border-radius:5px;background:#e2e8f0;position:relative;min-width:120px}
.pic-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.upd-row.changed td{background:#f0fdf4}
.upd-row.down td{background:#fff7ed}
.qbtn{border:1px solid var(--bdr-2);background:#fff;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer}
.qbtn:hover{background:var(--pri-soft)}
details.std summary{cursor:pointer;font-weight:700;color:var(--navy)}
@media(max-width:640px){.topbar{position:static}.tabs{top:0}.fgrid{grid-template-columns:1fr}.fgrid>.field{grid-column:auto!important}.modal-bg{padding:2vh 8px}.modal .mb{padding:12px}.topbar .ttl small{display:none}main{padding:12px 10px 60px}.topbar{padding:8px 10px}.pstrip{padding:8px 10px}.kpi .v{font-size:20px}}
@media print{.topbar,.tabs,.toolbar{display:none}}
.ro .ed{display:none!important}
#tip{position:fixed;z-index:300;max-width:300px;background:#0f172a;color:#f8fafc;font-size:12px;line-height:1.45;padding:8px 11px;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.28);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;display:none}
#tip.show{opacity:1;transform:none}
#tip b{color:#93c5fd;font-weight:700;display:block;margin-bottom:2px}
#tip::after{content:'';position:absolute;left:var(--ax,20px);width:9px;height:9px;background:#0f172a;transform:rotate(45deg)}
#tip.below::after{top:-4px}#tip.above::after{bottom:-4px}
.guide{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.guide nav{position:sticky;top:110px;background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:10px;font-size:13px}
.guide nav a{display:block;padding:5px 8px;border-radius:6px;color:var(--txt-2);text-decoration:none}
.guide nav a:hover{background:var(--pri-soft);color:var(--pri)}
.guide article h2{font-size:17px;color:var(--navy);margin:0 0 8px;scroll-margin-top:120px}
.guide article h4{margin:14px 0 6px;color:var(--navy-2);font-size:13.5px}
.guide article p,.guide article li{font-size:13.5px;line-height:1.6;color:#1e293b}
.guide article ol,.guide article ul{padding-left:20px;margin:6px 0}
.guide article code,.guide .kbd{font-family:'JetBrains Mono',monospace;font-size:12px;background:#f1f5f9;border:1px solid var(--bdr);border-radius:5px;padding:1px 5px}
.guide .steps{counter-reset:st;list-style:none;padding:0}
.guide .steps li{counter-increment:st;position:relative;padding:8px 10px 8px 42px;border:1px solid var(--bdr);border-radius:10px;margin-bottom:8px;background:#fff}
.guide .steps li::before{content:counter(st);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
@media(max-width:900px){.guide{grid-template-columns:minmax(0,1fr)}.guide nav{position:static}}
.auth-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;white-space:nowrap}
.auth-chip b{font-weight:700}.auth-chip .scope{color:#bfdbfe}
.auth-chip button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:999px;padding:3px 9px;cursor:pointer;font-size:11px}
.ro-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:10px;padding:7px 12px;font-size:12.5px}
.ro-banner.edit{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;text-align:left;margin-top:14px}
.pcard{border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer}
.pcard:hover{border-color:var(--pri);box-shadow:var(--shadow)}
.pcard b{display:block;color:var(--navy);font-size:14px}
.sc-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.sc-grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--txt-2);margin-right:2px}
.sc-in{padding:4px 7px;font-size:12.5px;width:auto}.sc-num{width:70px}
.sc-meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;font-size:12px;color:var(--txt-2);margin-bottom:6px}
#sc-wrap{height:clamp(380px,calc(100vh - 420px),1400px);cursor:crosshair}
#sc-sel{position:absolute;display:none;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.55);pointer-events:none}
@media(hover:none){.sc-hint{display:none}}
.pk-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pk-tools .inp{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--bdr-2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--txt-2)}
.seg button.on{background:var(--pri);color:#fff}
.pk-list{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding:2px}
.pk-card{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:12px;align-items:center;border:1px solid var(--bdr);border-radius:12px;padding:10px 12px;background:#fff}
.pk-card.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.pk-card b.nm{color:var(--navy);font-size:14px}
.pk-card .meta{font-size:12px;color:var(--txt-3);margin-top:2px}
.pk-card .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pk-prog .mini-bar{height:10px}
.pk-prog .lbl{font-size:11.5px;color:var(--txt-2);margin-top:3px}
@media(max-width:700px){.pk-card{grid-template-columns:minmax(0,1fr)}.pk-card .acts{justify-content:flex-start}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">&#8592; Portal</a>
  <div class="ttl">&#128200; Project Progress Monitor<small>WBS · CPM · S-Curve · Earned Value / Earned Schedule</small></div>
  <div class="grow"></div>

function dayKey(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toLocal(ms){const d=new Date(ms);return dayKey(ms)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function parseLocal(s){
  if(s==null||s==='') return NaN;
  if(s instanceof Date) return s.getTime();
  if(typeof s==='number') return s;
  const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/);
  if(!m){const t=Date.parse(s);return isNaN(t)?NaN:t;}
  return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)).getTime();
}
function fmtD(ms){if(!isFinite(ms))return '—';const d=new Date(ms);return pad(d.getDate())+' '+MON[d.getMonth()]+' '+String(d.getFullYear()).slice(2);}
function fmtDT(ms){if(!isFinite(ms))return '—';const d=new Date(ms);return fmtD(ms)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtWhen(ms){return P&&P.precision==='hour'?fmtDT(ms):fmtD(ms);}

const fn=(x,d=2)=>isFinite(x)?x.toFixed(d):'—';
function mins(s){const m=String(s||'').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):0;}

function canEdit(p){p=p||P;const s=sess();if(!s||!p)return false;if(EDIT_ALL_ROLES.includes(s.role))return true;
  if(!p.owner||!p.owner.user)return false;if(p.owner.user===s.user)return true;
  return !!(p.team&&p.area&&s.team===p.team&&s.areas.includes(p.area));}
function canManage(p){p=p||P;const s=sess();return !!(s&&p&&(s.role==='admin'||(p.owner&&p.owner.user===s.user)));}
function denyReason(){const s=sess();if(!P)return '';if(!s)return 'Mode baca saja — login untuk mengedit.';

function defaultProject(name){

// ---------------------------------------------------------------------
//  Cloud (Firestore) — optimistic concurrency on `rev`
// ---------------------------------------------------------------------
function cloudReady(){try{return typeof db!=='undefined'&&db&&typeof db.collection==='function';}catch(e){return false;}}
function forCloud(p){const o=JSON.parse(JSON.stringify(p));Object.keys(o).forEach(k=>{if(k.startsWith('_'))delete o[k];});return o;}
function setCloud(state,msg){CLOUD.state=state;CLOUD.msg=msg||'';renderCloudPill();}
function renderCloudPill(){
  const el=$('#cloud-pill');if(!el)return;
  const m={off:['',"☁ Lokal saja"],ok:['ok','☁ Tersinkron'],busy:['busy','☁ Menyimpan…'],err:['err','☁ Gagal sinkron'],denied:['err','☁ Cloud ditolak'],conflict:['err','☁ Konflik versi'],pending:['busy','☁ Belum tersimpan']};
  const [cls,txt]=m[CLOUD.state]||m.off;el.className='cloud-pill '+cls;el.textContent=txt;el.title=(CLOUD.msg||'')+' — klik untuk simpan ke cloud sekarang';
}
let _cloudTimer=null;
const DOC_LIMIT=950*1024,DOC_WARN=700*1024;
function trimChangeLog(){mutate(()=>{P.changes=(P.changes||[]).slice(0,100);});closeModal();cloudSave(false,true);}
function scheduleCloud(){
  if(!P||!cloudReady()||P.cloudSync===false||!canEdit()){return;}
  if(CLOUD.state==='denied'||CLOUD.state==='conflict')return;
  setCloud('pending');clearTimeout(_cloudTimer);_cloudTimer=setTimeout(()=>cloudSave(false,false),3500);
}
async function cloudSave(force,manual){
  if(!P)return;
  if(!cloudReady()){if(manual)toast('Cloud tidak tersedia (offline / Firebase belum termuat). Data tetap tersimpan lokal.',4000);return;}
  if(!canEdit()){if(manual)toast('🔒 '+denyReason(),4500);return;}
  if(!manual&&P.cloudSync===false)return;
  const bytes=new Blob([JSON.stringify(forCloud(P))]).size;
  if(bytes>DOC_LIMIT){setCloud('err','Ukuran proyek '+Math.round(bytes/1024)+' KB melebihi batas');
    openModal(`<div class="mh"><b>⚠️ Proyek terlalu besar untuk cloud</b><button class="x" onclick="closeModal()">×</button></div><div class="mb"><div class="note ng">Ukuran data proyek <b>${Math.round(bytes/1024)} KB</b>, batas satu dokumen Firestore ±1.000 KB. Perubahan terakhir <b>hanya tersimpan di perangkat ini</b>.</div>
    <p>Kurangi ukuran: hapus entri progress lama yang tidak perlu (setiap update tersimpan sebagai riwayat), kosongkan change log lama, atau pecah proyek menjadi beberapa proyek per fase. Backup JSON dulu sebelum menghapus.</p></div><div class="mf"><button class="btn" onclick="backupJSON()">💾 Backup JSON</button><button class="btn btn-ng" onclick="trimChangeLog()">Pangkas change log ke 100 entri</button><button class="btn btn-pri" onclick="closeModal()">OK</button></div>`);return;}
  if(bytes>DOC_WARN&&!P._sizeWarned){P._sizeWarned=true;toast('⚠️ Data proyek '+Math.round(bytes/1024)+' KB — mendekati batas cloud 1 MB.',6000);}
  clearTimeout(_cloudTimer);setCloud('busy');
  const ref=db.collection(CLOUD_COL).doc(P.id);
  try{
    let remote=null;
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      const rrev=snap.exists?(snap.data().rev||0):0;
      if(!force&&snap.exists&&rrev>(P._baseRev||0)){remote=snap.data();throw Object.assign(new Error('conflict'),{code:'conflict'});}
      stampSummary();const data=forCloud(P);data.rev=rrev+1;data.updatedAt=new Date().toISOString();
      tx.set(ref,data);P.rev=data.rev;P._baseRev=data.rev;
    }).catch(e=>{if(e.code==='conflict')e.remote=remote;throw e;});
    P._dirty=false;saveLocal();CLOUD.remote[P.id]=remoteMeta(P);
    setCloud('ok','Rev '+P.rev+' · '+fmtDT(Date.now()));if(manual)toast('☁ Tersimpan ke cloud (rev '+P.rev+')');
  }catch(e){
    if(e.code==='conflict'){setCloud('conflict','Versi cloud lebih baru');showConflict(e.remote);}
    else if(e.code==='permission-denied'){setCloud('denied','Firestore Rules belum mengizinkan koleksi '+CLOUD_COL);if(manual)toast('⚠️ Cloud ditolak: Firestore Rules untuk "'+CLOUD_COL+'" belum di-deploy. Data aman di lokal.',6000);}
    else{setCloud('err',e.message||String(e));if(manual)toast('⚠️ Gagal simpan cloud: '+(e.message||e),5000);}
  }
}
function showConflict(remote){
  openModal(`<div class="mh"><b>&#9888;&#65039; Konflik versi cloud</b><button class="x" onclick="closeModal()">×</button></div>
  <div class="mb"><div class="note warn">Proyek ini sudah diubah di perangkat/akun lain setelah terakhir Anda sinkron.<br>
  Versi cloud: <b>rev ${remote?remote.rev:'?'}</b> oleh <b>${esc(remote&&remote.updatedBy||'—')}</b> pada ${remote?fmtDT(Date.parse(remote.updatedAt)):'—'}.<br>
  Versi Anda: perubahan lokal belum tersinkron (basis rev ${P._baseRev||0}).</div>
  <p class="hint">Pilih salah satu. Agar tidak kehilangan data, Anda bisa unduh backup JSON versi lokal dulu.</p></div>
  <div class="mf"><button class="btn" onclick="backupJSON()">&#128190; Backup lokal dulu</button>
  <button class="btn" onclick="adoptCloud()">&#11015;&#65039; Pakai versi cloud</button>
  <button class="btn btn-ng" onclick="closeModal();cloudSave(true,true)">&#11014;&#65039; Timpa cloud dengan versi saya</button></div>`);
}
function stampSummary(){if(!C||!P||!C.cnt)return;P.summary={ev:+C.EV.toFixed(2),pv:+C.PV.toFixed(2),spi:isFinite(C.SPI)?+C.SPI.toFixed(3):null,status:C.status.t,statusK:C.status.k,done:C.cnt.done,total:C.cnt.total,at:new Date().toISOString()};}
function remoteMeta(d){return {summary:d.summary||null,rev:d.rev||0,name:d.name,updatedAt:d.updatedAt,updatedBy:d.updatedBy,team:d.team||'',area:d.area||'',owner:d.owner||null,location:d.location||'',nTasks:(d.tasks||[]).length};}
async function adoptCloud(id,quiet){
  id=id||(P&&P.id);if(!id||!cloudReady())return false;
  try{const snap=await db.collection(CLOUD_COL).doc(id).get();if(!snap.exists){if(!quiet)toast('Proyek tidak ditemukan di cloud (mungkin sudah dihapus).',4500);return false;}
    const p=normalizeProject(snap.data());if(!P||P.id!==p.id)VIEW={ddMode:'',dd:''};p._baseRev=p.rev||0;p._dirty=false;STORE.projects[p.id]=p;STORE.activeId=p.id;P=p;UNDO=[];CLOUD.remote[p.id]=remoteMeta(p);saveLocal();
    if(!quiet)closeModal();setCloud('ok','Rev '+p.rev);setUrlProject();renderAll();if(!quiet)toast('Versi cloud dimuat (rev '+p.rev+')');return true;}
  catch(e){if(!quiet)toast('Gagal memuat dari cloud: '+(e.message||e),5000);return false;}
}
// Pull a newer cloud version of the open project when this device has nothing unsaved.
async function refreshFromCloud(){
  if(!P||!cloudReady()||P._dirty||$('#modal-bg').classList.contains('show'))return;
  try{const snap=await db.collection(CLOUD_COL).doc(P.id).get();if(!snap.exists)return;const d=snap.data();
    if((d.rev||0)>(P._baseRev||0)){const tab=TAB;await adoptCloud(P.id,true);if(tab!==TAB)switchTab(tab);toast('🔄 Data diperbarui dari cloud (rev '+d.rev+' oleh '+(d.updatedBy||'—')+')',3500);}}catch(e){}
}
function setUrlProject(){try{const u=new URL(location.href);if(P)u.searchParams.set('project',P.id);else u.searchParams.delete('project');history.replaceState(null,'',u);}catch(e){}}
async function cloudBootstrap(){
  if(!cloudReady()){setCloud('off','Firebase tidak termuat');if(!P)renderAll();return;}
  if(!P)setCloud('busy','Memuat daftar proyek');
  try{
    const snap=await db.collection(CLOUD_COL).get();
    snap.forEach(doc=>{CLOUD.remote[doc.id]=remoteMeta(doc.data());});
    renderProjSelect();
    const want=URL_PROJECT;URL_PROJECT='';
    if(want&&CLOUD.remote[want]&&(!P||P.id!==want||CLOUD.remote[want].rev>(P._baseRev||0))){
      if(!STORE.projects[want]||!STORE.projects[want]._dirty){await adoptCloud(want,true);return;}
      P=STORE.projects[want];STORE.activeId=want;}
    else if(want&&!CLOUD.remote[want]&&!STORE.projects[want])toast('Proyek dari link tidak ditemukan di cloud.',5000);
    if(!P){renderAll();setCloud('ok','');return;}
    if(P){const r=CLOUD.remote[P.id];
      if(r&&r.rev>(P._baseRev||0)){ if(!P._dirty){await adoptCloud(P.id);} else {setCloud('conflict','Versi cloud lebih baru');showConflict(r);} }
      else if(!r&&canEdit()&&P.cloudSync!==false&&(P.tasks.length||P._dirty)) cloudSave(false,false);
      else setCloud(P._dirty?'pending':'ok',r?('Rev '+r.rev):'');}
    if(P&&P._dirty&&CLOUD.state==='pending')scheduleCloud();
  }catch(e){
    if(e.code==='permission-denied')setCloud('denied','Firestore Rules belum mengizinkan koleksi '+CLOUD_COL);
    else setCloud('err',e.message||String(e));
  }
}

// ---------------------------------------------------------------------
//  Working-time calendar
// ---------------------------------------------------------------------
function dayWindows(){
  const c=P.calendar;const s=mins(c.startTime),e=mins(c.endTime);
  if(!(e>s))return [[420,960]];
  if(c.breakOn){const bs=mins(c.breakStart),be=mins(c.breakEnd);if(bs>s&&be<e&&be>bs)return [[s,bs],[be,e]];}
  return [[s,e]];
}
function hpd(){return dayWindows().reduce((a,[x,y])=>a+(y-x),0)/60;}
function buildCal(minMs,maxMs){
  const c=P.calendar,hol=new Set(c.holidays||[]),W=dayWindows(),H=W.reduce((a,[x,y])=>a+(y-x),0)/60;
  const d0=new Date(minMs);let d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());
  const lim=Math.min(maxMs,minMs+25*365*DAY);const days=[];let cum=0;
  const wds=(c.workDays&&c.workDays.length)?c.workDays:[1,2,3,4,5];
  while(d.getTime()<=lim){const wd=wds.includes(d.getDay())&&!hol.has(dayKey(d.getTime()));days.push({ms:d.getTime(),wd,cum});if(wd)cum+=H;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}
  return {days,W,H,total:cum};
}
function dayIdx(ms){const D=CAL.days;if(ms<D[0].ms)return -1;let lo=0,hi=D.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(D[m].ms<=ms)lo=m;else hi=m-1;}return lo;}
function toW(ms){
  const D=CAL.days;const i=dayIdx(ms);if(i<0)return 0;const day=D[i];if(!day.wd)return day.cum;

// ---------------------------------------------------------------------
//  Progress measurement (rules of credit — PMI/AACE)
// ---------------------------------------------------------------------
const METHODS={pct:'% Complete (fisik)','0/100':'0/100 (selesai = kredit)','50/50':'50/50 (mulai 50%, selesai 100%)','20/80':'20/80 (mulai 20%, selesai 100%)'};

  if(method==='0/100')return v>=100?100:0;
  if(method==='50/50')return v>=100?100:v>0?50:0;
  if(method==='20/80')return v>=100?100:v>0?20:0;

}

// ---------------------------------------------------------------------
//  Core engine: weights, rollups, CPM, EVM / Earned Schedule
// ---------------------------------------------------------------------
function compute(){

  const ms=[parseLocal(P.startDate),dd,parseLocal(P.deadline),Date.now()];
  T.forEach(t=>{ms.push(parseLocal(t.start),parseLocal(t.finish));(t.progress||[]).forEach(e=>ms.push(parseLocal(e.t)));});
  (P.baselines||[]).forEach(b=>(b.tasks||[]).forEach(x=>ms.push(parseLocal(x.start),parseLocal(x.finish))));
  (P.issues||[]).forEach(i=>ms.push(parseLocal(i.date)));
  const fin=ms.filter(v=>isFinite(v));const lo=Math.min(...fin),hi=Math.max(...fin);const span=Math.max(hi-lo,30*DAY);
  CAL=buildCal(lo-60*DAY,hi+Math.max(4*span,400*DAY));
  const lvl=T.map(t=>+t.level||0);
  const isSum=T.map((t,i)=>i+1<n&&lvl[i+1]>lvl[i]);
  const parent=[];{const st=[];T.forEach((t,i)=>{while(st.length&&lvl[st[st.length-1]]>=lvl[i])st.pop();parent[i]=st.length?st[st.length-1]:-1;st.push(i);});}
  const X=T.map((t,i)=>{
    const sm=parseLocal(t.start),fm=parseLocal(t.finish);
    const s=isFinite(sm)?toW(sm):NaN,f=isFinite(fm)?toW(fm):NaN;
    const valid=isFinite(s)&&isFinite(f)&&f>=s-1e-9;
    const prog=(t.progress||[]).map(e=>({ms:parseLocal(e.t),pct:+e.pct||0})).filter(e=>isFinite(e.ms)).sort((a,b)=>a.ms-b.ms);
    return {i,id:t.id,sm,fm,s,f,dur:valid?Math.max(0,f-s):0,valid,prog,leaf:!isSum[i],lvl:lvl[i],parent:parent[i]};
  });
  // weights (only leaves carry weight; summaries roll up)
  // 'wbs' mode: 100 split equally across top-level (main) tasks, each node's share split equally
  // across its direct children, down to the leaves. Milestones take no share unless a group has
  // nothing else. Recomputed every compute(), so adding/moving/indenting tasks re-balances.
  let wbsShare=null;
  if(P.weightMode==='wbs'){wbsShare=new Array(n).fill(0);const kids={};T.forEach((t,i)=>{(kids[parent[i]]=kids[parent[i]]||[]).push(i);});
    const assign=(p,share)=>{const k=kids[p]||[];if(!k.length)return;const main=k.filter(i=>isSum[i]||T[i].type!=='milestone');const use=main.length?main:k;
      const each=share/use.length;use.forEach(i=>{if(isSum[i])assign(i,each);else wbsShare[i]=each;});};
    assign(-1,100);}
  let raw=X.map((x,i)=>{if(!x.leaf)return 0;const t=T[i];
    if(wbsShare)return wbsShare[i];
    if(P.weightMode==='duration')return t.type==='milestone'?0:x.dur;
    if(P.weightMode==='cost')return Math.max(0,+t.cost||0);
    return Math.max(0,+t.weight||0);});
  let tot=sum(raw),weightFallback=false;
  if(tot<=0){raw=X.map(x=>x.leaf&&x.valid?x.dur:0);tot=sum(raw);weightFallback=tot>0;}
  X.forEach((x,i)=>{x.raw=raw[i];x.eff=tot>0?raw[i]/tot:0;});
  let baseRaw=0,addRaw=0;X.forEach((x,i)=>{if(!x.leaf)return;if(T[i].scope==='added')addRaw+=x.raw;else baseRaw+=x.raw;});
  // status per leaf at data date
  const wdd=toW(dd);
  X.forEach((x,i)=>{if(!x.leaf)return;const t=T[i];
    x.plan=planFracW(x,wdd)*100;x.rawAct=rawAt(x,dd);x.act=credit(t.method,x.rawAct);
    const pd=x.prog.filter(e=>e.ms<=dd);x.aStart=(pd.find(e=>e.pct>0)||{}).ms;x.aFinish=(pd.find(e=>e.pct>=100)||{}).ms;
    x.future=x.prog.some(e=>e.ms>dd);
    x.state=x.act>=100?'done':x.act>0?'prog':'ns';
    const tol=0.5;
    if(x.act>=100)x.flag=(x.aFinish&&isFinite(x.fm)&&x.aFinish>x.fm+60000)?'lateDone':'done';
    else if(x.valid&&dd>x.fm)x.flag='overdue';
    else if(x.act<x.plan-tol)x.flag='behind';
    else if(x.act>x.plan+tol)x.flag='ahead';

  });

  const idx=new Map(T.map((t,i)=>[t.id,i]));
  const predL=T.map(()=>[]),succ=T.map(()=>[]);const badLinks=[];
  X.forEach((x,i)=>{if(!x.leaf||!x.valid)return;(T[i].preds||[]).forEach(p=>{const j=idx.get(p.id);
    if(j==null||j===i){badLinks.push(i);return;} if(!X[j].leaf||!X[j].valid){badLinks.push(i);return;}
    const L={j,type:p.type||'FS',lag:+p.lag||0};predL[i].push(L);succ[j].push({i,type:L.type,lag:L.lag});});});
  const indeg=X.map((x,i)=>predL[i].length);const q=[];X.forEach((x,i)=>{if(x.leaf&&x.valid&&indeg[i]===0)q.push(i);});
  const order=[];while(q.length){const i=q.shift();order.push(i);succ[i].forEach(s=>{if(--indeg[s.i]===0)q.push(s.i);});}
  const validLeaves=X.filter(x=>x.leaf&&x.valid);const cycle=order.length<validLeaves.length;
  order.forEach(i=>{const x=X[i];let es=predL[i].length?-Infinity:x.s;predL[i].forEach(p=>{const y=X[p.j];let c;
    if(p.type==='SS')c=y.ES+p.lag;else if(p.type==='FF')c=y.EF+p.lag-x.dur;else if(p.type==='SF')c=y.ES+p.lag-x.dur;else c=y.EF+p.lag;if(c>es)es=c;});
    if(!isFinite(es))es=x.s;x.ES=es;x.EF=es+x.dur;x.conflict=es-x.s>0.01?es-x.s:0;x.gap=x.s-es>0.01?x.s-es:0;});
  let projEF=-Infinity;order.forEach(i=>{if(X[i].EF>projEF)projEF=X[i].EF;});
  const dl=parseLocal(P.deadline);const target=isFinite(dl)?toW(dl):projEF;
  for(let k=order.length-1;k>=0;k--){const i=order[k],x=X[i];let lf=target;succ[i].forEach(s=>{const z=X[s.i];let c;
    if(s.type==='SS')c=z.LS-s.lag+x.dur;else if(s.type==='FF')c=z.LF-s.lag;else if(s.type==='SF')c=z.LF-s.lag+x.dur;else c=z.LS-s.lag;if(c<lf)lf=c;});
    x.LF=lf;x.LS=lf-x.dur;x.TF=x.LF-x.EF;}
  const pastDl=isFinite(dl)?X.filter(x=>x.leaf&&x.valid&&x.fm>dl+60000).map(x=>x.i):[];
  let minTF=Infinity;order.forEach(i=>{if(X[i].TF<minTF)minTF=X[i].TF;});
  order.forEach(i=>{X[i].crit=X[i].TF-minTF<=0.01;});
  // ---- rollups for summary rows ----
  X.forEach((x,i)=>{if(x.leaf)return;let e=i+1;while(e<n&&lvl[e]>lvl[i])e++;x.end=e;
    const L=X.slice(i+1,e).filter(y=>y.leaf);x.leaves=L.map(y=>y.i);
    const vs=L.filter(y=>y.valid);x.sm=vs.length?Math.min(...vs.map(y=>y.sm)):NaN;x.fm=vs.length?Math.max(...vs.map(y=>y.fm)):NaN;
    x.valid=vs.length>0;x.s=x.valid?toW(x.sm):NaN;x.f=x.valid?toW(x.fm):NaN;x.dur=x.valid?x.f-x.s:0;
    x.eff=sum(L.map(y=>y.eff));x.raw=sum(L.map(y=>y.raw));
    const ws=x.eff>0?L.map(y=>y.eff/x.eff):L.map(()=>1/Math.max(1,L.length));
    x.plan=sum(L.map((y,k)=>ws[k]*(y.plan||0)));x.act=sum(L.map((y,k)=>ws[k]*(y.act||0)));
    x.crit=L.some(y=>y.crit);x.state=x.act>=99.999?'done':x.act>0?'prog':'ns';
    x.flag=x.act>=99.999?'done':L.some(y=>y.flag==='overdue')?'overdue':x.act<x.plan-0.5?'behind':x.act>x.plan+0.5?'ahead':(x.plan>0||x.act>0?'ontrack':'future');
    const as=L.map(y=>y.aStart).filter(isFinite);x.aStart=as.length?Math.min(...as):undefined;
    x.aFinish=x.state==='done'?Math.max(...L.map(y=>y.aFinish||0)):undefined;});
  // WBS codes
  const wbs=[];{const ctr=[];T.forEach((t,i)=>{const L=lvl[i];ctr.length=L+1;ctr[L]=(ctr[L]||0)+1;wbs[i]=ctr.map(v=>v||1).join('.');});}
  // ---- project-level EVM / Earned Schedule ----
  const leaves=validLeaves;
  const projS=leaves.length?Math.min(...leaves.map(x=>x.sm)):parseLocal(P.startDate);
  const projF=leaves.length?Math.max(...leaves.map(x=>x.fm)):parseLocal(P.startDate);
  const W0=isFinite(projS)?toW(projS):0,WF=isFinite(projF)?toW(projF):0;
  const PVw=w=>100*sum(leaves.map(x=>x.eff*planFracW(x,w)));
  const EVms=m=>sum(X.filter(x=>x.leaf).map(x=>x.eff*credit(T[x.i].method,rawAt(x,m))));
  const PV=PVw(wdd),EV=EVms(dd),AT=wdd-W0;
  let ES=0;
  if(EV>0){const pvEnd=PVw(WF);if(EV>=pvEnd-1e-9)ES=WF-W0;else{let a=W0,b=WF;for(let k=0;k<50;k++){const m=(a+b)/2;if(PVw(m)<EV)a=m;else b=m;}ES=b-W0;}}

  let BX=[];if(bl){BX=(bl.tasks||[]).map(b=>{const sm=parseLocal(b.start),fm=parseLocal(b.finish);const s=toW(sm),f=toW(fm);const valid=isFinite(sm)&&isFinite(fm)&&f>=s;return {id:b.id,name:b.name,sm,fm,s,f,dur:valid?f-s:0,valid,eff:+b.eff||0};});}
  const BLw=w=>100*sum(BX.map(b=>b.eff*planFracW(b,w)));
  const blF=BX.length?Math.max(...BX.filter(b=>b.valid).map(b=>b.fm)):NaN;

// ---------------------------------------------------------------------
//  Curve sampling (S-Curve)
// ---------------------------------------------------------------------
function curveData(granOverride,range){
  const c=C;if(!c.cnt.total)return null;
  let t0=Math.min(c.projS,isFinite(c.blS)?c.blS:Infinity);
  const dlc=parseLocal(P.deadline);
  let t1=Math.max(isFinite(dlc)?dlc:-Infinity,c.projF,isFinite(c.blF)?c.blF:-Infinity,c.dd<c.projF*2?Math.min(c.dd,c.projF+(c.projF-c.projS)*6):-Infinity,isFinite(c.fcMs)?c.fcMs:-Infinity);
  if(!isFinite(t0)||!isFinite(t1)||t1<=t0)return null;
  const full=[t0,t1];
  if(range){t0=Math.max(t0,range.a);t1=Math.min(t1,range.b);if(!(t1>t0))return null;}
  let gran=granOverride||P.curveGran||'auto';
  const spanD=(t1-t0)/DAY;
  if(gran==='auto')gran=spanD<=21?'cp':spanD<=150?'day':'week';
  const W=CAL.W;const out=[t0];const cp=Math.max(1,+P.calendar.cpHours||3)*60;
  const i0=Math.max(0,dayIdx(t0)),i1=dayIdx(t1);
  for(let i=i0;i<=i1&&i<CAL.days.length;i++){const d=CAL.days[i];if(!d.wd)continue;
    if(gran==='cp'){for(let m=W[0][0];m<=W[W.length-1][1];m+=cp)out.push(d.ms+m*60000);}
    else if(gran==='day')out.push(d.ms+W[W.length-1][1]*60000);
    else{let j=i+1;while(j<CAL.days.length&&!CAL.days[j].wd)j++;const nx=CAL.days[j];
      if(!nx||new Date(nx.ms).getDay()<=new Date(d.ms).getDay()||nx.ms-d.ms>=7*DAY)out.push(d.ms+W[W.length-1][1]*60000);}}
  out.push(t1);
  if(c.dd>t0&&c.dd<t1)out.push(c.dd);
  let pts=[...new Set(out.filter(v=>v>=t0&&v<=t1))].sort((a,b)=>a-b);
  if(pts.length>1600){return curveData(gran==='cp'?'day':'week',range);}
  const plan=[],base=[],act=[],fc=[];
  const wdd=c.wdd;
  pts.forEach(m=>{const w=toW(m);
    plan.push(m<=c.projF+60000||w<=c.WF?c.PVw(w):100);
    base.push(c.bl?c.BLw(w):null);
    act.push(m<=c.dd?c.EVms(m):null);
    if(isFinite(c.fcW)&&!c.doneAll&&m>=c.dd){const pw=c.W0+c.ES+(w-wdd)*(c.SPIt||0);fc.push(m>=c.fcMs?100:Math.max(c.EV,c.PVw(Math.min(pw,c.WF))));}
    else fc.push(m===c.dd&&isFinite(c.fcW)&&!c.doneAll?c.EV:null);});
  const labels=pts.map(m=>gran==='cp'?fmtDT(m):fmtD(m));
  // Zoom edges / the data date can add a second point on the same day: show the time on those.
  labels.forEach((l,k)=>{if((k>0&&labels[k-1]===l)||(k+1<labels.length&&labels[k+1]===l))labels[k]=fmtDT(pts[k]);});
  labels.forEach((l,k)=>{if(k>0&&fmtDT(pts[k-1])===labels[k-1]&&labels[k-1]===l)labels[k]=fmtDT(pts[k]);});
  return {pts,labels,plan,base,act,fc,gran,full};
}

function predText(t){return (t.preds||[]).map(p=>{const j=C.idx.get(p.id);if(j==null)return '?';let s=String(j+1);if((p.type||'FS')!=='FS'||p.lag)s+=(p.type||'FS');if(p.lag){const d=P.precision==='hour'?p.lag+'j':(Math.round(p.lag/CAL.H*100)/100)+'d';s+=(p.lag>0?'+':'')+d;}return s;}).join(', ');}
function parsePreds(txt,selfIdx){
  const out=[],errs=[];String(txt||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d+)\s*(FS|SS|FF|SF)?\s*(?:([+-])\s*(\d+(?:[.,]\d+)?)\s*(j|jam|h|hr|hari|d)?)?$/i);
    if(!m){errs.push(tok);return;}const row=+m[1]-1;if(row<0||row>=P.tasks.length||row===selfIdx){errs.push(tok);return;}
    const t=P.tasks[row];if(C.isSum[row]){errs.push(tok+' (grup)');return;}
    let lag=0;if(m[4]){lag=parseFloat(m[4].replace(',','.'));const u=(m[5]||'').toLowerCase();if(u==='d'||u==='hari'||u==='hr'||(!u&&P.precision!=='hour'))lag*=CAL.H;if(m[3]==='-')lag=-lag;}
    out.push({id:t.id,type:(m[2]||'FS').toUpperCase(),lag});});
  return {preds:out,errs};
}

// ---- Auto predecessors from the dates (Finish-to-Start) ----
// For each leaf: its predecessors are the task(s) that finish LAST before it starts. Candidates
// are searched level by level up the WBS — the other members of its own group first (by date,
// not row order), then its parent's sibling groups, … — so each phase chains internally instead of linking to every task
// that happens to end the same day elsewhere. Overlapping tasks are parallel and never linked.
function autoPredPlan(scope,mode){
  const c=C,T=c.T,E=0.001;const L=c.X.filter(x=>x.leaf&&x.valid);
  const leavesOf=j=>c.X[j].leaf?[j]:(c.X[j].leaves||[]);
  const pools=x=>{if(scope==='project')return [L.map(y=>y.i)];const out=[];let node=x.i;
    while(node!==-1&&node!=null){const par=c.X[node].parent;const pool=[];
      for(let j=0;j<c.n;j++){if(j!==node&&c.X[j].parent===par)pool.push(...leavesOf(j));}
      if(pool.length)out.push(pool);node=par;}
    out.push(L.map(y=>y.i));return out;};
  const plan=[];
  L.forEach(x=>{const t=T[x.i];if(mode==='empty'&&(t.preds||[]).length)return;
    const ok=y=>y&&y!==x&&y.leaf&&y.valid&&y.f<=x.s+E&&(y.s<x.s-E||(Math.abs(y.s-x.s)<=E&&y.i<x.i));
    for(const pool of pools(x)){const cand=pool.map(j=>c.X[j]).filter(ok);if(!cand.length)continue;
      const fmax=Math.max(...cand.map(y=>y.f));const pr=cand.filter(y=>y.f>=fmax-E).map(y=>y.i).sort((a,b)=>a-b);
      const old=(t.preds||[]).map(p=>c.idx.get(p.id)).filter(v=>v!=null).sort((a,b)=>a-b);
      if(pr.join()!==old.join())plan.push({i:x.i,preds:pr,old});break;}});

}

}

const ddLinePlugin={id:'ddline',afterDatasetsDraw(ch){const x=ch.scales.x;if(!x)return;const fs=ch.$fs||11;
  (ch.$marks||[]).forEach((m,n)=>{if(m.i==null)return;const i0=Math.floor(m.i),f=m.i-i0;const px=x.getPixelForValue(i0)+(i0+1<ch.data.labels.length?(x.getPixelForValue(i0+1)-x.getPixelForValue(i0))*f:0);
    const ctx=ch.ctx;ctx.save();ctx.strokeStyle=m.color;ctx.setLineDash(m.dash);ctx.lineWidth=m.w||1.5;ctx.beginPath();ctx.moveTo(px,ch.chartArea.top);ctx.lineTo(px,ch.chartArea.bottom);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle=m.color;ctx.font='600 '+fs+'px Inter,sans-serif';const tw=ctx.measureText(m.label).width;
    ctx.fillText(m.label,px+4+tw>ch.chartArea.right?px-tw-4:px+4,ch.chartArea.top+fs+2+n*(fs+6));ctx.restore();});}};
function scurveConfig(cd,opts={}){
  const ds=[];
  if(cd.base.some(v=>v!=null))ds.push({label:'Baseline',data:cd.base,borderColor:'#94a3b8',borderDash:[6,4],borderWidth:2,pointRadius:0,tension:.25,fill:false});
  ds.push({label:'Rencana',data:cd.plan,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.08)',borderWidth:2.5,pointRadius:0,tension:.25,fill:!opts.compact?false:false});
  ds.push({label:'Aktual',data:cd.act,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.12)',borderWidth:3,pointRadius:cd.pts.length<80?2.5:0,tension:.2,fill:false,spanGaps:false});
  if(cd.fc.some(v=>v!=null))ds.push({label:'Forecast',data:cd.fc,borderColor:'#f59e0b',borderDash:[3,3],borderWidth:2,pointRadius:0,tension:.25,fill:false});
  if(opts.periodic){const pp=cd.plan.map((v,k)=>k?Math.max(0,v-cd.plan[k-1]):v);const pa=cd.act.map((v,k)=>v==null?null:k?Math.max(0,v-(cd.act[k-1]||0)):v);
    ds.push({type:'bar',label:'Rencana periodik',data:pp,backgroundColor:'rgba(37,99,235,.25)',yAxisID:'y2',order:10});
    ds.push({type:'bar',label:'Aktual periodik',data:pa,backgroundColor:'rgba(22,163,74,.35)',yAxisID:'y2',order:11});}
  const scales={x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:opts.compact?8:14,font:{size:10}},grid:{display:false}},
    y:Object.assign({ticks:{callback:v=>(+v.toFixed(2))+'%'},title:{display:!opts.compact,text:'Kumulatif (%)'}},opts.y==='auto'?{grace:'6%'}:opts.y?{min:opts.y.min,max:opts.y.max}:{min:0,max:100})};
  if(opts.periodic)scales.y2={position:'right',beginAtZero:true,grid:{display:false},ticks:{callback:v=>v+'%'},title:{display:true,text:'Periodik (%)'}};
  return {type:'line',data:{labels:cd.labels,datasets:ds},plugins:[ddLinePlugin],
    options:{responsive:!opts.static,maintainAspectRatio:false,animation:(opts.static||opts.noAnim)?false:{duration:250},interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{boxWidth:14,font:{size:11}}},tooltip:{callbacks:{label:it=>it.raw==null?null:`${it.dataset.label}: ${(+it.raw).toFixed(2)}%`}}},scales}};
}
function idxAt(cd,d){const p=cd.pts;if(!isFinite(d)||d<p[0]||d>p[p.length-1])return null;for(let k=0;k<p.length-1;k++){if(d>=p[k]&&d<=p[k+1])return k+(p[k+1]>p[k]?(d-p[k])/(p[k+1]-p[k]):0);}return p.length-1;}
function setMarks(ch,cd,fs){ch.$fs=fs||11;ch.$marks=[{i:idxAt(cd,C.dd),color:'#dc2626',label:'Data Date',dash:[5,4]}];
  const dl=parseLocal(P.deadline);if(isFinite(dl))ch.$marks.push({i:idxAt(cd,dl),color:'#7c3aed',label:'Deadline '+fmtWhen(dl),dash:[],w:2});}
function drawSCurve(canvasId,opts={}){
  killChart(canvasId);const cv=document.getElementById(canvasId);if(!cv||typeof Chart==='undefined')return;
  const cd=curveData(opts.gran,opts.range);if(!cd){if(!opts.range)cv.parentElement.innerHTML='<div class="empty">Isi tanggal task untuk melihat kurva</div>';return;}
  const ch=new Chart(cv.getContext('2d'),scurveConfig(cd,opts));ch.$cd=cd;setMarks(ch,cd);ch.update('none');CH[canvasId]=ch;return cd;

let SC={gran:'',periodic:false,table:false,x0:NaN,x1:NaN,ymode:'full',ymin:0,ymax:100,h:0};
const SC_MIN_SPAN=3*HOUR;
function scFull(){const cd=curveData(SC.gran||undefined);return cd?cd.full:null;}
function scRange(){const f=scFull();if(!f)return null;const a=isFinite(SC.x0)?Math.max(f[0],SC.x0):f[0],b=isFinite(SC.x1)?Math.min(f[1],SC.x1):f[1];return {a,b,f,zoomed:isFinite(SC.x0)};}
function scSetX(a,b){const f=scFull();if(!f)return;let w=Math.max(SC_MIN_SPAN,b-a);if(w>=f[1]-f[0]){SC.x0=SC.x1=NaN;return scUpdate();}
  if(b-a<SC_MIN_SPAN){const c=(a+b)/2;a=c-w/2;b=c+w/2;}if(a<f[0]){b+=f[0]-a;a=f[0];}if(b>f[1]){a-=b-f[1];b=f[1];}SC.x0=Math.max(a,f[0]);SC.x1=b;scUpdate();}
function scZoom(fac,center){const r=scRange();if(!r)return;const c=isFinite(center)?center:(r.a+r.b)/2;scSetX(c-(c-r.a)*fac,c+(r.b-c)*fac);}

function scPreset(v){if(!v)return;if(v==='all'){SC.x0=SC.x1=NaN;return scUpdate();}const d=C.dd;const r=scFull();
  if(v==='todd')return scSetX(r[0],Math.max(d,r[0]+SC_MIN_SPAN));if(v==='fromdd')return scSetX(Math.min(d,r[1]-SC_MIN_SPAN),r[1]);const n=+v;scSetX(d-n*DAY,d+n*DAY);}
function scDate(which,val){const r=scRange();if(!r)return;if(!val)return;const m=parseLocal(val);if(!isFinite(m))return;
  if(which==='a')scSetX(P.precision==='hour'?m:m,r.b);else scSetX(r.a,P.precision==='hour'?m:m+DAY-60000);}
function scYMode(v){SC.ymode=v;scUpdate();}
function scYVal(){const a=parseFloat($('#sc-ymin').value),b=parseFloat($('#sc-ymax').value);if(!isFinite(a)||!isFinite(b)||b<=a){toast('Isi Y min lebih kecil dari Y max');return;}SC.ymode='manual';SC.ymin=a;SC.ymax=b;scUpdate();}
function scHeight(v){SC.h=+v||0;const w=$('#sc-wrap');if(w)w.style.height=SC.h?SC.h+'px':'';if(CH['ch-sc'])CH['ch-sc'].resize();}
let _scRaf=0;function scUpdate(){if(_scRaf)return;_scRaf=requestAnimationFrame(()=>{_scRaf=0;scDraw();});}
function scDraw(){
  const r=scRange();if(!r)return;
  const cd=drawSCurve('ch-sc',{gran:SC.gran||undefined,periodic:SC.periodic,range:r.zoomed?{a:r.a,b:r.b}:null,y:SC.ymode==='auto'?'auto':SC.ymode==='manual'?{min:SC.ymin,max:SC.ymax}:null,noAnim:true});
  const ch=CH['ch-sc'];const dIn=m=>P.precision==='hour'?toLocal(m):dayKey(m);
  const x0=$('#sc-x0'),x1=$('#sc-x1');if(x0&&document.activeElement!==x0)x0.value=dIn(r.a);if(x1&&document.activeElement!==x1)x1.value=dIn(r.b);

function scBind(){
  const wrap=$('#sc-wrap'),cv=$('#ch-sc'),sel=$('#sc-sel');if(!wrap||!cv)return;
  const area=()=>{const ch=CH['ch-sc'];return ch&&ch.chartArea;};
  const toMs=px=>{const ch=CH['ch-sc'];if(!ch||!ch.$cd)return NaN;const p=ch.$cd.pts,n=p.length,xs=ch.scales.x;if(n<2)return p[0];
    const f=clamp((px-xs.left)/(xs.right-xs.left),0,1)*(n-1),i=Math.min(n-2,Math.floor(f));return p[i]+(p[i+1]-p[i])*(f-i);};
  wrap.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey||e.shiftKey))return;e.preventDefault();const r=cv.getBoundingClientRect();
    if(e.shiftKey&&!e.ctrlKey&&!e.metaKey){scPan(Math.sign(e.deltaY||e.deltaX)*0.5);return;}
    scZoom(e.deltaY<0?0.8:1.25,toMs(e.clientX-r.left));},{passive:false});
  let x0=null;
  cv.addEventListener('mousedown',e=>{const a=area();if(!a||e.button!==0)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(x<a.left||x>a.right||y<a.top||y>a.bottom)return;x0=x;sel.style.cssText=`display:block;left:${x}px;width:0;top:${a.top}px;height:${a.bottom-a.top}px`;e.preventDefault();});
  if(window.__scMM){window.removeEventListener('mousemove',window.__scMM);window.removeEventListener('mouseup',window.__scMU);}
  window.__scMM=e=>{if(x0==null)return;const a=area(),r=cv.getBoundingClientRect();const x=clamp(e.clientX-r.left,a.left,a.right);sel.style.left=Math.min(x0,x)+'px';sel.style.width=Math.abs(x-x0)+'px';};
  window.__scMU=e=>{if(x0==null)return;const r=cv.getBoundingClientRect(),a=area();const x=clamp(e.clientX-r.left,a.left,a.right);sel.style.display='none';const lo=Math.min(x0,x),hi=Math.max(x0,x);x0=null;
    if(hi-lo>=8)scSetX(toMs(lo),toMs(hi));};

}

function renderGantt(){

  if(!rows.length){el.innerHTML='<div class="card empty"><b>Belum ada task bertanggal</b></div>';return;}
  let t0=Math.min(c.projS,isFinite(c.blS)?c.blS:Infinity,c.dd),t1=Math.max(c.projF,isFinite(c.blF)?c.blF:-Infinity,c.dd,isFinite(c.fcMs)?c.fcMs:-Infinity);
  if(!isFinite(t0)||!isFinite(t1)){el.innerHTML='<div class="card empty"><b>Tanggal belum lengkap</b></div>';return;}
  const d0=new Date(t0);t0=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()-1).getTime();const d1=new Date(t1);t1=new Date(d1.getFullYear(),d1.getMonth(),d1.getDate()+2).getTime();
  const nd=Math.round((t1-t0)/DAY);const gw=Math.max(500,(($('#p-gantt')&&$('#p-gantt').clientWidth)||1200)-340);const px=GZ.px||clamp(Math.floor(gw/nd),6,140);const RH=26,HH=44;const W=Math.max(400,nd*px);
  const X=m=>(m-t0)/DAY*px;
  // Rows are laid out by the (wrapping) label column first, then the SVG reuses those heights.
  const svgFor=hs=>{const tops=[];let acc=HH;hs.forEach(h=>{tops.push(acc);acc+=h;});const H=acc;
  let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">`;
  // background days
  const hol=new Set(P.calendar.holidays||[]);const wds=P.calendar.workDays||[1,2,3,4,5];
  for(let k=0;k<nd;k++){const dm=new Date(new Date(t0).getFullYear(),new Date(t0).getMonth(),new Date(t0).getDate()+k);const x=X(dm.getTime());
    const off=!wds.includes(dm.getDay())||hol.has(dayKey(dm.getTime()));
    if(off)s+=`<rect x="${x}" y="${HH}" width="${px}" height="${H-HH}" fill="${hol.has(dayKey(dm.getTime()))?'#fef2f2':'#f8fafc'}"/>`;
    if(dm.getDate()===1||k===0)s+=`<text x="${x+3}" y="16" font-size="11" font-weight="700" fill="#0f2a5c">${MON[dm.getMonth()]} ${dm.getFullYear()}</text><line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#cbd5e1"/>`;
    const lbl=px>=26?String(dm.getDate()):(dm.getDay()===1&&px>=6?String(dm.getDate()):'');
    if(lbl)s+=`<text x="${x+px/2}" y="36" font-size="10" text-anchor="middle" fill="${off?'#94a3b8':'#475569'}">${lbl}</text>`;
    if(px>=60)s+=`<text x="${x+px/2}" y="26" font-size="9" text-anchor="middle" fill="#94a3b8">${DOWS[dm.getDay()]}</text>`;
    if(px>=14||dm.getDay()===1)s+=`<line x1="${x}" y1="${HH}" x2="${x}" y2="${H}" stroke="#f1f5f9"/>`;}
  s+=`<line x1="0" y1="${HH}" x2="${W}" y2="${HH}" stroke="#e2e8f0"/>`;
  const pos={};
  rows.forEach((i,r)=>{const x=c.X[i],t=c.T[i],rh=hs[r],y=tops[r]+(rh-RH)/2;pos[t.id]={r,y};
    s+=`<line x1="0" y1="${tops[r]+rh}" x2="${W}" y2="${tops[r]+rh}" stroke="#f1f5f9"/>`;
    if(GZ.base&&c.bl){const b=c.BX.find(b=>b.id===t.id);if(b&&b.valid){s+=`<rect x="${X(b.sm)}" y="${y+RH-7}" width="${Math.max(2,X(b.fm)-X(b.sm))}" height="4" rx="2" fill="#cbd5e1"><title>Baseline ${fmtWhen(b.sm)} → ${fmtWhen(b.fm)}</title></rect>`;}}

      s+=`<rect x="${xa}" y="${y+8}" width="${w*clamp(x.act,0,100)/100}" height="6" fill="#16a34a"/>`;}
    else if(t.type==='milestone'||x.dur<=1e-9){const cx=xb,cy=y+RH/2-2;s+=`<path d="M${cx} ${cy-7}L${cx+7} ${cy}L${cx} ${cy+7}L${cx-7} ${cy}Z" fill="${x.state==='done'?'#16a34a':x.crit?'#dc2626':'#7c3aed'}"><title>${esc(t.name)} — ${fmtWhen(x.fm)}</title></path>`;}
    else{const col=x.crit?'#fca5a5':t.scope==='added'?'#fdba74':'#93c5fd',bd=x.crit?'#dc2626':t.scope==='added'?'#ea580c':'#2563eb';
      s+=`<rect x="${xa}" y="${y+5}" width="${w}" height="13" rx="3" fill="${col}" stroke="${bd}" stroke-width="1"><title>${esc(t.name)}\n${fmtWhen(x.sm)} → ${fmtWhen(x.fm)}\nRencana ${fp(x.plan)} · Aktual ${fp(x.act)}${isFinite(x.TF)?'\nFloat '+durLabel(x.TF):''}</title></rect>`;
      if(x.act>0)s+=`<rect x="${xa}" y="${y+8}" width="${w*clamp(x.act,0,100)/100}" height="7" rx="2" fill="#16a34a" pointer-events="none"/>`;
      if(x.leaf&&isFinite(x.TF)&&x.TF>0.01&&px>=8){const fe=X(fromW(x.f+x.TF,'finish'));s+=`<line x1="${xb}" y1="${y+11}" x2="${fe}" y2="${y+11}" stroke="#94a3b8" stroke-dasharray="2,2"/>`;}
      if(w>40&&px>=20)s+=`<text x="${xb+4}" y="${y+16}" font-size="10" fill="#475569">${esc(t.pic||'')}</text>`;}
  });
  if(GZ.arrows){rows.forEach(i=>{const t=c.T[i];const to=pos[t.id];const xs=c.X[i];if(!to||!xs.leaf||!xs.valid)return;

      const ty=p.type||'FS';const x1=ty==='SS'||ty==='SF'?X(xp.sm):X(xp.fm),y1=fr.y+RH/2-1;const x2=ty==='FF'||ty==='SF'?X(xs.fm):X(xs.sm),y2=to.y+RH/2-1;

    s=s.replace('<svg ','<svg ')+'';s=s.replace(/(<svg[^>]*>)/,'$1<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#64748b"/></marker></defs>');}

  if(P.deadline){const xl=X(parseLocal(P.deadline));s+=`<line x1="${xl}" y1="${HH}" x2="${xl}" y2="${H}" stroke="#7c3aed" stroke-width="1.5"/><text x="${xl+3}" y="${H-4}" font-size="9" fill="#7c3aed" font-weight="700">Deadline</text>`;}
  s+='</svg>';return {s,xd};};
  el.innerHTML=`<div class="card"><h3>Gantt Chart <span class="sub">biru = rencana · hijau = aktual · merah = critical path · oranye = pekerjaan tambahan · abu = baseline · garis putus = float</span>
    <span class="right view-ok"><select class="inp" style="width:auto" onchange="GZ.px=+this.value;renderGantt()">${[[0,'Otomatis'],[140,'Jam'],[60,'Hari'],[40,'Hari (rapat)'],[18,'Minggu'],[6,'Bulan']].map(([v,l])=>`<option value="${v}"${GZ.px===v?' selected':''}>Zoom: ${l}</option>`).join('')}</select>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px"><input type="checkbox" ${GZ.arrows?'checked':''} onchange="GZ.arrows=this.checked;renderGantt()"> Relasi</label>
    <label style="display:flex;gap:5px;align-items:center;font-size:12px"><input type="checkbox" ${GZ.base?'checked':''} onchange="GZ.base=this.checked;renderGantt()"> Baseline</label></span></h3>
    <div class="gantt"><div class="g-left"><div class="gh">Task</div>${rows.map(i=>{const t=c.T[i],x=c.X[i];return `<div class="gr ${x.leaf?'':'sum'}" style="padding-left:${8+c.lvl[i]*12}px">${x.leaf?'':`<span style="cursor:pointer" onclick="toggleCollapse('${t.id}')">${COLLAPSED.has(t.id)?'▸':'▾'}</span>`}<span class="gn"><span class="mono" style="color:var(--txt-3);font-size:10px">${c.wbs[i]}</span> ${esc(t.name||'(tanpa nama)')}</span></div>`;}).join('')}</div>
    <div class="g-right" id="g-right"></div></div></div>`;
  const hs=$$('#p-gantt .g-left .gr').map(e=>e.getBoundingClientRect().height);const gh=$('#p-gantt .g-left .gh');if(gh)gh.style.height=HH+'px';

function picStats(){const c=C,m={};c.X.filter(x=>x.leaf).forEach(x=>{const t=c.T[x.i];const k=t.pic||'(tanpa PIC)';const o=m[k]=m[k]||{pic:k,n:0,eff:0,pv:0,ev:0,done:0,late:0};

//  Schedule Health (DCMA 14-Point inspired)

function healthChecks(){
  const c=C,T=c.T;const L=c.X.filter(x=>x.leaf);const V=L.filter(x=>x.valid);const n=V.length||1;const H=CAL.H;
  const out=[];const add=(code,title,value,pass,thr,detail,ids)=>out.push({code,title,value,pass,thr,detail,ids:ids||[]});
  const linked=new Set();V.forEach(x=>(T[x.i].preds||[]).forEach(p=>{linked.add(p.id);}));
  const noPred=V.filter(x=>!(T[x.i].preds||[]).length),noSucc=V.filter(x=>!linked.has(x.id));
  const first=V.reduce((a,x)=>!a||x.sm<a.sm?x:a,null),last=V.reduce((a,x)=>!a||x.fm>a.fm?x:a,null);
  const missing=V.filter(x=>(noPred.includes(x)&&x!==first)||(noSucc.includes(x)&&x!==last));
  add('1','Logic — task tanpa predecessor/successor',fp(missing.length/n*100,0),missing.length/n<=0.05,'≤ 5%','Task yang tidak terhubung logika tidak ikut terdorong saat pekerjaan sebelumnya molor. Isi kolom Predecessor, atau pakai 🔗 Predecessor otomatis di tab Jadwal.',missing.map(x=>x.id));
  const rels=[];V.forEach(x=>(T[x.i].preds||[]).forEach(p=>rels.push({x,p})));const nr=rels.length||1;
  const leads=rels.filter(r=>r.p.lag<0);add('2','Leads (lag negatif)',String(leads.length),leads.length===0,'0','Lag negatif menyembunyikan tumpang tindih — pecah task bila perlu.',leads.map(r=>r.x.id));
  const lags=rels.filter(r=>r.p.lag>0);add('3','Lags',fp(lags.length/nr*100,0),lags.length/nr<=0.05,'≤ 5% relasi','Lag positif (waktu tunggu, mis. curing) sebaiknya dijadikan task tersendiri agar terlihat.',lags.map(r=>r.x.id));
  const fs=rels.filter(r=>(r.p.type||'FS')==='FS');add('4','Tipe relasi Finish-to-Start',rels.length?fp(fs.length/nr*100,0):'—',!rels.length||fs.length/nr>=0.9,'≥ 90%','Relasi FS paling mudah dibaca dan dianalisis.',[]);
  add('5','Konflik logika (mulai sebelum predecessor mengizinkan)',String(c.cnt.conflicts),c.cnt.conflicts===0,'0','Gunakan ⚙ Jadwalkan Ulang Otomatis di tab Jadwal.',L.filter(x=>x.conflict>0).map(x=>x.id));
  const hf=V.filter(x=>isFinite(x.TF)&&x.TF>44*H);add('6','High float (> 44 hari kerja)',fp(hf.length/n*100,0),hf.length/n<=0.05,'≤ 5%','Float sangat besar biasanya tanda logika yang kurang.',hf.map(x=>x.id));
  const nf=V.filter(x=>isFinite(x.TF)&&x.TF<-0.01);add('7','Negative float',String(nf.length),nf.length===0,'0',P.deadline?'Task ini membuat proyek melewati deadline.':'Isi deadline di Pengaturan untuk mengaktifkan cek ini.',nf.map(x=>x.id));
  const hd=V.filter(x=>x.dur>44*H&&T[x.i].type!=='milestone');add('8','Durasi panjang (> 44 hari kerja)',fp(hd.length/n*100,0),hd.length/n<=0.05,'≤ 5%','Pecah task panjang agar progress bisa diukur lebih akurat.',hd.map(x=>x.id));
  const inv=L.filter(x=>x.future||(!x.valid));add('9','Tanggal tidak valid',String(inv.length),inv.length===0,'0','Progress tercatat setelah Data Date, atau tanggal task belum lengkap / terbalik.',inv.map(x=>x.id));
  const nopic=L.filter(x=>!T[x.i].pic);add('10','Resource — task tanpa PIC',String(nopic.length),nopic.length===0,'0','Setiap task perlu penanggung jawab.',nopic.map(x=>x.id));
  const due=L.filter(x=>x.valid&&x.fm<=c.dd);const missed=due.filter(x=>!(x.aFinish&&x.aFinish<=x.fm+60000));
  add('11','Missed tasks (selesai melewati rencana)',due.length?fp(missed.length/due.length*100,0):'—',!due.length||missed.length/due.length<=0.05,'≤ 5%','Task yang seharusnya sudah selesai tapi selesai terlambat / belum selesai.',missed.map(x=>x.id));
  add('12','Critical path test (logika tersambung)',c.cycle?'Siklus!':c.cnt.crit?'OK':'—',!c.cycle&&c.cnt.crit>0,'tanpa siklus',c.cycle?'Ada relasi melingkar — critical path tidak bisa dihitung.':'Critical path terdeteksi: '+c.cnt.crit+' task.',[]);
  let cpli=NaN;if(P.deadline&&isFinite(c.target)){const rem=c.target-c.wdd;const cpl=Math.max(0,(isFinite(c.fcW)?c.fcW:c.WF)-c.wdd);cpli=cpl>0?(rem)/(cpl):NaN;}
  add('13','CPLI (Critical Path Length Index)',fn(cpli),!isFinite(cpli)||cpli>=0.95,'≥ 0.95',P.deadline?'Sisa waktu ke deadline ÷ sisa durasi forecast.':'Isi deadline untuk menghitung CPLI.',[]);
  let bei=NaN;if(c.bl){const bd=c.BX.filter(b=>b.valid&&b.fm<=c.dd);const done=L.filter(x=>x.aFinish&&x.aFinish<=c.dd).length;bei=bd.length?done/bd.length:NaN;}
  add('14','BEI (Baseline Execution Index)',fn(bei),!isFinite(bei)||bei>=0.95,'≥ 0.95',c.bl?'Task selesai ÷ task yang menurut baseline harus selesai s.d. Data Date.':'Tetapkan baseline untuk menghitung BEI.',[]);
  const wOk=P.weightMode!=='manual'||Math.abs(c.tot-100)<0.01||c.tot===0;
  add('W','Total bobot input = 100',String(Math.round(c.tot*100)/100),wOk,'100','Tidak wajib (sistem menormalisasi otomatis), tapi memudahkan pembacaan. Gunakan Σ Normalisasi.',[]);
  add('B','Baseline ditetapkan',c.bl?'Ya':'Belum',!!c.bl,'Ya','Tanpa baseline, varian jadwal & pertumbuhan scope tidak bisa diukur.',[]);
  return out;
}

function setP(k,v){mutate(()=>{P[k]=v;if(k==='name')logChange('project','Nama proyek → '+v);});}
function setCal(k,v){mutate(()=>{P.calendar[k]=v;});}
function setTh(k,v){mutate(()=>{P.thresholds[k]=clamp(parseFloat(v)||0,0,1);});}
function toggleWD(d,on){mutate(()=>{const s=new Set(P.calendar.workDays);on?s.add(d):s.delete(d);if(!s.size)s.add(1);P.calendar.workDays=[...s].sort();});}
function setHolidays(v){mutate(()=>{P.calendar.holidays=[...new Set(String(v).split(/[\s,;]+/).map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s)))].sort();});}

  if(free)return TEAMS;const o={};if(s.team&&TEAMS[s.team]){o[s.team]=s.areas.filter(a=>TEAMS[s.team].includes(a));if(!o[s.team].length)delete o[s.team];}return o;}
function scopeSelects(team,area,idT,idA){const o=scopeOptions();const teams=Object.keys(o);if(!team||!o[team])team=teams[0]||'';

function fillAreaSel(idT,idA){const o=scopeOptions();const t=$('#'+idT).value;$('#'+idA).innerHTML=(o[t]||[]).map(a=>`<option>${esc(a)}</option>`).join('');}

function setOwner(p,team,area){const s=sess();p.owner={user:s.user,name:s.name,role:s.role};p.team=team||s.team||'';p.area=area||s.areas[0]||'';}
function createProject(){
  if(!sess())return;
  const p=defaultProject($('#np-name').value.trim()||'Proyek Baru');const tmp=P;P=p;
  p.startDate=$('#np-start').value+'T'+p.calendar.startTime;p.precision=$('#np-prec').value;p.location=$('#np-loc').value.trim();
  setOwner(p,$('#np-team').value,$('#np-area').value);
  p.changes=[{id:uid(),at:new Date().toISOString(),by:who(),type:'project',desc:'Proyek dibuat',taskId:''}];
  STORE.projects[p.id]=p;STORE.activeId=p.id;UNDO=[];p._dirty=true;saveLocal();closeModal();setUrlProject();renderAll();switchTab('tasks');scheduleCloud();
}
function switchProject(v){
  if(!v)return;if(v.startsWith('cloud:')){adoptCloud(v.slice(6));return;}
  P=STORE.projects[v];STORE.activeId=v;UNDO=[];SEL=null;COLLAPSED.clear();VIEW={ddMode:'',dd:''};saveLocal();setUrlProject();
  const r=CLOUD.remote[v];setCloud(r?(r.rev>(P._baseRev||0)?'conflict':P._dirty?'pending':'ok'):'off');renderAll();
  if(r&&r.rev>(P._baseRev||0)){if(!P._dirty)adoptCloud(v,true);else if(canEdit())showConflict(r);}
}
function dupProject(){if(!sess()){openLogin('Login untuk menduplikasi proyek.');return;}const n=JSON.parse(JSON.stringify(P));setOwner(n,P.team,P.area);n.createdAt=new Date().toISOString();n.id='prj_'+uid();n.name=P.name+' (salinan)';n.rev=0;delete n._baseRev;n._dirty=true;STORE.projects[n.id]=n;STORE.activeId=n.id;P=n;UNDO=[];saveLocal();renderAll();toast('Proyek diduplikasi');}
async function deleteProject(){
  if(!canManage()){toast('Hanya pembuat proyek atau admin yang bisa menghapus.',4000);return;}
  const name=prompt(`Hapus proyek "${P.name}"? Ketik HAPUS untuk konfirmasi.\n(Backup JSON dulu bila ragu.)`);if(name!=='HAPUS')return;
  const id=P.id;
  if(cloudReady()&&CLOUD.remote[id]&&confirm('Hapus juga dari cloud (semua perangkat)?')){try{await db.collection(CLOUD_COL).doc(id).delete();delete CLOUD.remote[id];}catch(e){toast('Gagal hapus di cloud: '+(e.message||e),5000);}}
  delete STORE.projects[id];const ids=Object.keys(STORE.projects);STORE.activeId=ids[0]||null;P=STORE.activeId?STORE.projects[STORE.activeId]:null;UNDO=[];saveLocal();setUrlProject();renderAll();
}

function backupJSON(){if(!P)return;const b=new Blob([JSON.stringify(forCloud(P),null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=safeName(P.name)+'_backup_'+dayKey(Date.now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function safeName(s){return String(s||'proyek').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').slice(0,60);}
function cellDate(v){if(v==null||v==='')return NaN;if(v instanceof Date)return new Date(v.getFullYear(),v.getMonth(),v.getDate(),v.getHours(),v.getMinutes()+(v.getSeconds()>=30?1:0)).getTime();if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d,d.H,d.M+(d.S>=30?1:0)).getTime():NaN;}return parseLocal(String(v).trim());}
function num(v){if(v==null||v==='')return NaN;if(typeof v==='number')return v;const n=parseFloat(String(v).replace('%','').replace(',','.'));return n;}
async function handleImport(file){
  if(!file)return;
  if(!sess()){openLogin('Login dulu untuk mengimport — proyek hasil import tercatat atas nama Anda.');return;}
  if(/\.json$/i.test(file.name)){try{const p=normalizeProject(JSON.parse(await file.text()));if(!p.tasks)throw new Error('Bukan backup proyek');
    if(STORE.projects[p.id]&&!confirm(`Proyek "${p.name}" sudah ada di perangkat ini. Timpa dengan isi backup?`)){p.id='prj_'+uid();p.name+=' (restore)';}
    if(!p.owner||!p.owner.user)setOwner(p);
    const ex=STORE.projects[p.id]||(CLOUD.remote[p.id]?{owner:CLOUD.remote[p.id].owner,team:CLOUD.remote[p.id].team,area:CLOUD.remote[p.id].area}:null);
    if(ex&&!canEdit(ex)){p.id='prj_'+uid();p.name+=' (restore)';setOwner(p,p.team,p.area);}
    p._dirty=true;p._baseRev=STORE.projects[p.id]?STORE.projects[p.id]._baseRev:0;STORE.projects[p.id]=p;STORE.activeId=p.id;P=p;UNDO=[];saveLocal();renderAll();scheduleCloud();toast('Backup dimuat');}
    catch(e){alert('Gagal membaca JSON: '+e.message);}return;}
  if(typeof XLSX==='undefined'){alert('Library Excel belum termuat (butuh internet).');return;}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    let p;
    if(wb.SheetNames.includes('Step Kerja'))p=importPomiTemplate(wb);
    else if(wb.SheetNames.includes('Tasks'))p=importOwnExport(wb);
    else p=importGeneric(wb);
    if(!p||!p.tasks.length){alert('Tidak menemukan daftar task di file ini.');return;}
    setOwner(p);STORE.projects[p.id]=p;STORE.activeId=p.id;P=p;UNDO=[];p._dirty=true;setUrlProject();
    compute();
    if(p._autoBaseline){const bt=C.X.filter(x=>x.leaf&&C.T[x.i].scope!=='added');const tb=sum(bt.map(x=>x.raw))||1;
      p.baselines=[{id:'bl_'+uid(),name:'Baseline awal (import)',reason:'Rencana awal dari sheet "Step Kerja"',at:new Date().toISOString(),by:who(),tasks:bt.map(x=>{const t=C.T[x.i];return {id:t.id,name:t.name,start:t.start,finish:t.finish,eff:x.raw/tb,scope:'base'};})}];
      p.activeBaselineId=p.baselines[0].id;delete p._autoBaseline;}
    saveLocal();renderAll();switchTab('dash');scheduleCloud();
    toast(`📥 "${p.name}": ${p.tasks.length} task diimport`,4000);
  }catch(e){console.error(e);alert('Gagal import Excel: '+e.message);}
}
function sheetRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});}
function importPomiTemplate(wb){
  const tmp=P;const p=defaultProject('Import');P=p;
  const dash=wb.Sheets['Dashboard']?sheetRows(wb.Sheets['Dashboard']):[];
  const nameRow=dash.find(r=>r&&/nama proyek/i.test(String(r[0]||'')));if(nameRow&&nameRow[1])p.name=String(nameRow[1]).trim();
  const stRow=dash.find(r=>r&&/tanggal mulai/i.test(String(r[0]||'')));
  p.precision='hour';p.calendar.cpHours=3;p.curveGran='cp';
  const readList=(sheet,added)=>{const rows=sheetRows(wb.Sheets[sheet]||{});const out=[];
    for(let r=1;r<rows.length;r++){const row=rows[r]||[];if(/^total$/i.test(String(row[0]||'').trim()))break;const name=row[1];if(name==null||String(name).trim()==='')continue;
      const sm=cellDate(row[4]);let fm=cellDate(row[5]);const hrs=num(row[3]);
      const t=newTask({name:String(name).trim(),pic:row[2]!=null?String(row[2]).trim():'',weight:isFinite(num(row[6]))?Math.round(num(row[6])*100*10000)/10000:0,scope:added?'added':'base'});
      t._row=r;t._hrs=hrs;t._sm=sm;t._fm=fm;
      if(added){const fd=cellDate(row[10]);t.addedDate=isFinite(fd)?dayKey(fd):'';t.justification=row[11]!=null?String(row[11]):'';}
      out.push(t);}return out;};
  const base=readList('Step Kerja',false),add=readList('Pekerjaan Tambahan',true);
  // progress: header row 0 = checkpoint datetimes from col 3; rows map to Step Kerja rows (same index) then a
  // "PEKERJAAN TAMBAHAN" divider, with tambahan rows following 2 rows later
  const pu=wb.Sheets['Progress Update']?sheetRows(wb.Sheets['Progress Update']):[];
  const hdr=(pu[0]||[]).map(cellDate);
  let divider=pu.findIndex(r=>r&&/pekerjaan tambahan/i.test(String(r[0]||'')));
  const attach=(t,row)=>{if(!row)return;for(let c=3;c<row.length;c++){const v=num(row[c]);if(!isFinite(v)||!isFinite(hdr[c]))continue;t.progress.push({t:toLocal(hdr[c]),pct:clamp(v<=1.0000001?v*100:v,0,100),by:'import',note:'',at:new Date().toISOString()});}};
  base.forEach(t=>attach(t,pu[t._row]));
  if(divider>=0)add.forEach(t=>attach(t,pu[divider+1+t._row]));
  p.tasks=[...base,...add];

    if(i===rows[rows.length-1]||o.getY()+RH>BOT){const xd=X(c.dd);pdf.setDrawColor(220,38,38);pdf.setLineDashPattern([1,1],0);pdf.line(xd,pageTop-1,xd,o.getY());pdf.setLineDashPattern([],0);}
  });
  pdf.setFontSize(6.2);pdf.setTextColor(100,116,139);o.setY(o.getY()+1);o.checkY(5);pdf.text('Biru = rencana, hijau = aktual, merah = critical path, oranye = pekerjaan tambahan, abu tipis = baseline, garis merah putus = data date.',M,o.getY()+2.5);o.setY(o.getY()+6);
}

function tipFor(el){
  if(el.dataset.tip)return ['',el.dataset.tip];
  if(el.classList.contains('tab'))return [el.textContent.trim(),TAB_TIPS[el.dataset.tab]||''];
  if(el.id==='proj-btn')return ['Pilih proyek','Buka daftar semua proyek untuk dilihat atau diupdate. Cari, filter proyek yang bisa Anda edit, lalu Buka / Update Progress.'];
  if(el.id==='cloud-pill')return ['Status cloud',(CLOUD.msg?CLOUD.msg+'. ':'')+'Klik untuk menyimpan ke database online sekarang.'];
  if(el.closest('.dd-chip'))return ['Data Date','Titik waktu acuan perhitungan. "Sekarang" = waktu saat ini; "Tetap" = pilih tanggal (mis. untuk laporan per cut-off). Pengunjung baca-saja bisa mengubahnya tanpa tersimpan.'];
  const oc=el.getAttribute('onclick')||'';
  const q=oc.match(/qset\(this,(\d+)\)/);if(q)return ['Isi cepat','Isi '+q[1]+'% pada kolom progress baris ini.'];
  for(const [re,t] of TIP_RULES){if(t&&re.test(oc))return t;}
  const nt=el.dataset.ntitle||el.getAttribute('title');return nt?['',nt]:null;
}
(function initTips(){
  let mq;try{mq=window.matchMedia('(hover: hover) and (pointer: fine)');}catch(e){return;}
  const tip=document.getElementById('tip');let timer=null,cur=null;
  const SEL='button, .tab, #cloud-pill, .dd-chip select, [data-tip]';
  const hide=()=>{clearTimeout(timer);cur=null;tip.classList.remove('show');tip.style.display='none';};
  const show=el=>{const t=tipFor(el);if(!t||!t[1])return;
    tip.innerHTML=(t[0]?`<b>${esc(t[0])}</b>`:'')+esc(t[1]);tip.style.display='block';tip.className='';
    const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
    let left=clamp(r.left+r.width/2-w/2,8,vw-w-8),top=r.bottom+9,below=true;if(top+h>vh-8){top=r.top-h-9;below=false;}
    tip.style.left=left+'px';tip.style.top=top+'px';tip.style.setProperty('--ax',clamp(r.left+r.width/2-left-4,10,w-18)+'px');
    tip.classList.add(below?'below':'above');requestAnimationFrame(()=>tip.classList.add('show'));};
  document.addEventListener('mouseover',e=>{if(!mq.matches)return;const el=e.target.closest(SEL);if(el===cur)return;hide();if(!el)return;
    if(el.hasAttribute('title')){el.dataset.ntitle=el.getAttribute('title');el.removeAttribute('title');}
    cur=el;timer=setTimeout(()=>{if(cur===el)show(el);},380);});
  document.addEventListener('mouseout',e=>{if(cur&&!cur.contains(e.relatedTarget))hide();});
  ['mousedown','scroll','keydown'].forEach(ev=>window.addEventListener(ev,hide,true));
})();
