      <li><b>Milestone</b> — durasi 0, untuk titik penting (permit terbit, energize, serah terima).</li></ul>
    <h4>Predecessor (urutan kerja)</h4>
    <p>Tulis nomor baris task pendahulu, dipisah koma. Tipe relasi dan lag opsional:</p>
    <div class="tbl-wrap"><table class="t"><tr><th>Tulis</th><th>Arti</th></tr>
      <tr><td><code>3</code></td><td>Mulai setelah task 3 selesai (Finish-to-Start)</td></tr>
      <tr><td><code>3SS</code></td><td>Mulai bersamaan dengan task 3 mulai (Start-to-Start)</td></tr>
      <tr><td><code>3FF</code></td><td>Selesai bersamaan dengan task 3 selesai (Finish-to-Finish)</td></tr>
      <tr><td><code>4FS+2</code></td><td>Mulai 2 ${P&&P.precision==='hour'?'jam':'hari'} kerja setelah task 4 selesai (mis. curing)</td></tr>
      <tr><td><code>5FF-1d</code></td><td>Selesai 1 hari sebelum task 5 selesai (akhiran <code>d</code> = hari, <code>j</code> = jam)</td></tr></table></div>
    <p><b>🔗 Predecessor otomatis</b> mengisi kolom ini dari tanggal yang sudah ada: tiap task dihubungkan ke task yang selesai paling akhir sebelum ia mulai (dicari dulu di grup yang sama, lalu grup sebelumnya). Ada pratinjau sebelum diterapkan, pilihan hanya-yang-kosong atau timpa semua, dan bisa di-undo.</p>
    <p>Dengan predecessor, aplikasi menghitung <b>critical path</b> (tanda <span class="chip crit">CP</span>, bar merah) dan <b>float</b> (kelonggaran waktu). Bila sebuah task molor, <b>⚙ Jadwalkan Ulang Otomatis</b> menggeser semua turunannya; bila selesai lebih cepat, <b>⇤ Rapatkan ASAP</b> menarik turunannya maju. Keduanya hanya menggeser task yang belum mulai.</p></div>

  <div class="card" id="g-bobot"><h2>5. Bobot &amp; pekerjaan tambahan</h2>
    <p><b>Bobot</b> menentukan seberapa besar sumbangan tiap task ke progress keseluruhan. Isi angka bebas di kolom <b>Bobot input</b> (mis. persen); kolom <b>Bobot efektif</b> selalu dinormalisasi sehingga totalnya 100%. Tombol <b>Σ Normalisasi</b> merapikan input menjadi total 100. Tombol <b>⚖ Bobot otomatis per WBS</b> membagi 100% rata ke semua <b>main task</b> (tingkat teratas), lalu bobot tiap main task dibagi rata ke sub-task di bawahnya — mis. 4 main task = 25% masing-masing; main task dengan 5 sub-task = 5% per sub-task. Mode ini menyesuaikan sendiri saat task ditambah/dihapus/dipindah; klik tombolnya lagi untuk menyalin hasilnya ke bobot manual bila ingin menyetel task tertentu. Mode lain (Pengaturan): bobot otomatis dari <b>durasi</b> atau dari <b>biaya</b>.</p>
    <p><b>Pekerjaan tambahan</b> (temuan lapangan / variation order): gunakan <b>➕ Pekerjaan Tambahan</b> atau ubah kategori scope di detail task (⋯), isi tanggal ditemukan dan justifikasinya. Bobotnya menambah total scope, lalu <b>semua bobot dinormalisasi ulang</b> — sama seperti kolom "Bobot Tersesuaikan" di Excel. Karena itu progress keseluruhan bisa turun saat scope bertambah (contoh: aktual 32,5% + tambahan 8% → 32,5 ÷ 1,08 = 30,1%). Pertumbuhan scope terlihat di Dashboard dan tab Baseline &amp; Scope.</p></div>

  <div class="card" id="g-progress"><h2>6. Update progress lapangan</h2>
    <ul><li><b>Tab Update Progress</b> (disarankan): pilih <b>waktu update</b>, isi % kumulatif baru (tombol cepat 25/50/75/100), catatan opsional, lalu <b>💾 Simpan Update</b>. Kolom kosong = tidak berubah. Filter "Perlu update" menampilkan task yang sedang/akan berjalan.</li>
      <li><b>Kolom Aktual %</b> di tab Jadwal — dicatat pada Data Date saat ini.</li>
      <li><b>Detail task (⋯)</b> — lihat/perbaiki riwayat progress, termasuk mengisi data yang terlewat dengan tanggal mundur.</li></ul>
    <p>Progress selalu <b>kumulatif</b> (0–100%) dan dibawa ke waktu berikutnya sampai ada update baru. Nilai lebih kecil dari sebelumnya (rework) boleh, ditandai oranye.</p>
    <h4>Metode pengukuran (detail task)</h4><ul><li><b>% Complete</b> — sesuai isian fisik.</li><li><b>0/100</b> — baru dihitung saat selesai (cocok untuk pekerjaan singkat/inspeksi).</li><li><b>50/50</b>, <b>20/80</b> — dapat 50% / 20% saat mulai, 100% saat selesai.</li></ul>
    <h4>Data Date</h4><p>Titik waktu acuan semua perhitungan. <b>Sekarang</b> = waktu saat ini (untuk pemantauan harian). <b>Tetap</b> = tanggal tertentu (untuk laporan cut-off, mis. laporan mingguan per Jumat 16:00).</p></div>

  <div class="card" id="g-baca"><h2>7. Membaca dashboard &amp; S-curve</h2>
    <div class="tbl-wrap"><table class="t"><tr><th>Istilah</th><th>Arti</th><th>Cara membaca</th></tr>
      <tr><td><b>Rencana (PV)</b></td><td>% yang seharusnya selesai pada Data Date menurut jadwal saat ini</td><td>—</td></tr>
      <tr><td><b>Aktual (EV)</b></td><td>% yang benar-benar selesai (Σ bobot × % task)</td><td>—</td></tr>
      <tr><td><b>Deviasi (SV)</b></td><td>Aktual − Rencana</td><td>negatif = tertinggal</td></tr>
      <tr><td><b>SPI</b></td><td>Aktual ÷ Rencana</td><td>1,00 = sesuai; 0,90 = hanya 90% dari target</td></tr>
      <tr><td><b>SPI(t)</b>, <b>SV(t)</b></td><td>Earned Schedule — kinerja jadwal dalam satuan waktu</td><td>SV(t) −1,5 hari = progress setara jadwal 1,5 hari kerja lalu</td></tr>
      <tr><td><b>Forecast selesai</b></td><td>Perkiraan tanggal selesai bila laju SPI(t) berlanjut</td><td>merah = lewat rencana</td></tr>
      <tr><td><b>Float</b></td><td>Berapa lama task boleh molor tanpa memundurkan proyek</td><td>0 = kritis</td></tr></table></div>
    <p>Status proyek: <b>ON TRACK</b> (SPI(t) ≥ 1), <b>PERLU PERHATIAN</b> (≥ ${P?P.thresholds.warn:0.95}), <b>TERLAMBAT</b> (≥ ${P?P.thresholds.crit:0.9}), <b>KRITIS / DELAY</b> (di bawahnya). Ambang bisa diubah di Pengaturan.</p>
    <p><b>Kurva S</b>: garis biru = rencana, abu putus-putus = baseline, hijau = aktual, oranye putus-putus = forecast, garis merah vertikal = Data Date. Interval bisa checkpoint (per N jam kerja), harian, atau mingguan; centang <i>Batang periodik</i> untuk melihat progress per periode.</p>
    <p><b>Zoom &amp; skala</b> (tab S-Curve): tombol 🔍+ / 🔍− / ◀ ▶, pilihan <i>Rentang cepat</i> (mis. ±7 hari dari Data Date), <b>Skala X</b> (tanggal dari–sampai), <b>Skala Y</b> (0–100%, Otomatis mengikuti data yang terlihat, atau Manual min–max), dan <b>Tinggi</b> grafik. Di desktop: Ctrl + scroll atau pinch trackpad untuk zoom, seret di grafik untuk memilih area, Shift + scroll untuk menggeser, klik dua kali untuk reset. Ukuran huruf tidak ikut berubah, dan titik data otomatis makin rapat saat di-zoom.</p></div>

  <div class="card" id="g-alat"><h2>8. Gantt, look-ahead, health check</h2>
    <ul><li><b>Gantt</b> — bar biru (rencana), hijau (aktual), merah (critical path), oranye (pekerjaan tambahan), abu tipis (baseline), garis putus (float), panah (relasi). Zoom otomatis atau pilih jam/hari/minggu/bulan.</li>
      <li><b>Look-ahead</b> — pekerjaan 3–42 hari ke depan per PIC, untuk menyiapkan material, permit, dan manpower. Juga kinerja per PIC dan daftar milestone.</li>
      <li><b>Schedule Health</b> — 16 pemeriksaan kualitas jadwal (adaptasi DCMA 14-Point). Angka merah di tab = jumlah yang belum lolos; klik nomor task untuk memperbaikinya.</li>
      <li><b>Kendala &amp; Log</b> — catat hambatan (cuaca, permit, material…) dengan dampak jam kerja sebagai bukti justifikasi keterlambatan; change log mencatat siapa mengubah apa dan kapan.</li></ul></div>

  <div class="card" id="g-baseline"><h2>9. Baseline &amp; change control</h2>
    <p>Baseline adalah jadwal &amp; bobot yang dibekukan sebagai acuan. Tetapkan sekali setelah rencana disetujui. Setelah itu tab Baseline menampilkan varian tiap task (Δ mulai/selesai dalam hari kerja, perubahan bobot, task baru/terhapus). Bila rencana berubah resmi, lakukan <b>Re-baseline</b> dengan alasan — baseline lama tetap tersimpan dan bisa dipilih untuk dibandingkan.</p></div>

  <div class="card" id="g-simpan"><h2>10. Penyimpanan, berbagi &amp; sinkron</h2>
    <p>Setiap perubahan tersimpan <b>di perangkat</b> seketika dan <b>ke database online (Firebase Firestore)</b> otomatis beberapa detik kemudian — lihat status ☁ di kanan atas (<i>Tersinkron</i> / <i>Belum tersimpan</i> / <i>Gagal</i>). Tetap bisa bekerja saat sinyal hilang; data dikirim saat online kembali (atau klik ☁).</p>
    <ul><li><b>🔗 Bagikan</b> — salin link langsung ke proyek. Pembuka link tanpa login melihat mode baca; data diperbarui otomatis saat tab dibuka kembali.</li>
      <li><b>Dua orang mengedit bersamaan</b> — aplikasi mencegah versi lama menimpa versi baru. Bila terjadi, muncul pilihan: pakai versi cloud, timpa dengan versi Anda, atau backup dulu.</li>
      <li><b>Batas ukuran</b> — satu proyek maksimal ±1 MB di database (cukup untuk ratusan task dengan riwayat panjang). Aplikasi memperingatkan sejak 700 KB.</li>
      <li><b>💾 Backup JSON</b> — simpan salinan lengkap di komputer Anda secara berkala untuk proyek penting.</li></ul></div>

  <div class="card" id="g-laporan"><h2>11. Laporan PDF &amp; Excel</h2>
    <p><b>⬇️ PDF</b> — laporan A4 berkop POMI berisi KPI, kurva S, daftar task, Gantt, look-ahead 14 hari, pekerjaan tambahan, dan kendala; ada pratinjau sebelum diunduh. Atur Data Date "Tetap" dulu untuk laporan per tanggal cut-off. <b>📊 Excel</b> — 7 sheet (ringkasan, task, S-curve, progress log, kendala, change log, health check).</p></div>

  <div class="card" id="g-faq"><h2>12. Masalah umum</h2>
    <div class="tbl-wrap"><table class="t"><tr><th>Masalah</th><th>Solusi</th></tr>
      <tr><td>Semua kolom abu-abu / tidak bisa diketik</td><td>Mode baca saja — login, atau akun Anda bukan pemilik/tim proyek ini (lihat banner oranye).</td></tr>
      <tr><td>Tombol ➕ Proyek meminta login</td><td>Membuat &amp; import proyek wajib login.</td></tr>
      <tr><td>"Akun belum punya Team/Area"</td><td>Atur di Review &amp; Approval Dashboard → ⚙ Pengaturan → Team &amp; Area, lalu login ulang.</td></tr>
      <tr><td>☁ Konflik versi</td><td>Orang lain menyimpan lebih dulu. Pilih "Pakai versi cloud" bila perubahan Anda sedikit, atau backup dulu lalu timpa.</td></tr>
      <tr><td>☁ Gagal / Belum tersimpan</td><td>Periksa internet lalu klik ☁. Data aman di perangkat.</td></tr>
      <tr><td>Tanda ⚠ di samping nama task</td><td>Arahkan kursor untuk melihat masalahnya (mulai sebelum predecessor, tanggal belum lengkap, dll).</td></tr>
      <tr><td>Progress turun setelah menambah pekerjaan</td><td>Normal — scope bertambah sehingga bobot dinormalisasi ulang (lihat bagian 5).</td></tr>
      <tr><td>Lupa password</td><td>Reset di Review &amp; Approval Dashboard ("Lupa password?").</td></tr></table></div></div>

  <div class="card" id="g-standar"><h2>13. Standar yang dipakai</h2><ul>
    <li><b>PMI PMBOK® Guide &amp; Practice Standard for Scheduling</b> — WBS, milestone, Precedence Diagramming Method, Critical Path Method, baseline, data date, look-ahead.</li>
    <li><b>ANSI/EIA-748 &amp; PMI Practice Standard for Earned Value Management</b> — PV, EV, SV, SPI.</li>
    <li><b>Earned Schedule</b> — SPI(t), SV(t), forecast tanggal selesai IEAC(t).</li>
    <li><b>AACE International Recommended Practices</b> — aturan kredit progress (% complete, 0/100, 50/50, 20/80).</li>
    <li><b>DCMA 14-Point Schedule Assessment</b> — pemeriksaan kesehatan jadwal.</li>
    <li><b>ISO 21502</b> — change control, issue log, re-baseline beralasan.</li></ul></div>
  </article></div>`;
}
