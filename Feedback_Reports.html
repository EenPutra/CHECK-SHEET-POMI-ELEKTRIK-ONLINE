<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Bug &amp; Masukan</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20261005a"></script>
<script src="auth-session.js?v=20261005a"></script>
<style>
:root{
  --bg:#f1f5f9;--surf:#fff;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--bdr:#e2e8f0;--bdr2:#cbd5e1;
  --pri:#1e3a5f;--acc:#2563eb;--acc-bg:#eff6ff;
  --red:#dc2626;--red-bg:#fef2f2;--amb:#b45309;--amb-bg:#fffbeb;--grn:#15803d;--grn-bg:#f0fdf4;
  --vio:#6d28d9;--vio-bg:#f5f3ff;--gry-bg:#f1f5f9;--scrim:rgba(15,23,42,.55);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220;--surf:#111a2e;--ink:#e2e8f0;--ink2:#cbd5e1;--mute:#94a3b8;--bdr:#1e293b;--bdr2:#334155;
  --pri:#1e3a5f;--acc:#60a5fa;--acc-bg:#172554;
  --red:#f87171;--red-bg:#3b1212;--amb:#fbbf24;--amb-bg:#3a2a07;--grn:#4ade80;--grn-bg:#0f2e1a;
  --vio:#a78bfa;--vio-bg:#241a45;--gry-bg:#1e293b;--scrim:rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
a{color:var(--acc)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:14px}
.top{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top a.back{color:#cbd5e1;text-decoration:none;font-weight:600;font-size:13px}
.top h1{font-size:17px;margin:0;flex:1;min-width:180px}
.top .who{font-size:12.5px;color:#cbd5e1}
.top button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 11px;font:600 12.5px 'Barlow',sans-serif;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.22)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;cursor:pointer}
.stat:hover{border-color:var(--acc)}
.stat .n{font-size:24px;font-weight:800}.stat .l{font-size:12px;color:var(--mute);font-weight:600}
.bar{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{border:1.5px solid var(--bdr2);border-radius:7px;padding:6px 8px;font:13px 'Barlow',sans-serif;background:var(--surf);color:var(--ink)}
.bar input[type=search]{flex:1;min-width:180px}
.btn{border:1.5px solid var(--pri);background:var(--surf);color:var(--ink);border-radius:7px;padding:6px 11px;font:700 12.5px 'Barlow',sans-serif;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.55;cursor:default}
.count{color:var(--mute);font-size:12.5px;margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surf);border:1px solid var(--bdr);border-left:4px solid var(--bdr2);border-radius:10px;padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card.p-kritis{border-left-color:var(--red)}.card.p-tinggi{border-left-color:var(--amb)}.card.p-sedang{border-left-color:var(--acc)}
.card .t{font-weight:700;font-size:14.5px;margin:4px 0 3px}
.card .m{color:var(--mute);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gry-bg);color:var(--ink2)}
.tag.code{font-family:ui-monospace,Menlo,monospace;background:var(--acc-bg);color:var(--acc)}
.s-baru{background:var(--acc-bg);color:var(--acc)}.s-ditinjau{background:var(--vio-bg);color:var(--vio)}
.s-dikerjakan{background:var(--amb-bg);color:var(--amb)}.s-selesai{background:var(--grn-bg);color:var(--grn)}
.s-ditolak{background:var(--gry-bg);color:var(--mute)}
.pr-kritis{background:var(--red-bg);color:var(--red)}.pr-tinggi{background:var(--amb-bg);color:var(--amb)}
.empty{text-align:center;color:var(--mute);padding:40px 10px;background:var(--surf);border:1px dashed var(--bdr2);border-radius:10px}
.note{padding:10px 12px;border-radius:9px;margin-bottom:12px;font-size:13px}
.note.err{background:var(--red-bg);color:var(--red)}
/* login */
.login{max-width:360px;margin:60px auto;background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:20px}
.login h2{margin:0 0 4px;font-size:17px}.login p{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.login input{width:100%;border:1.5px solid var(--bdr2);border-radius:7px;padding:8px;margin-bottom:8px;font:14px 'Barlow',sans-serif;background:var(--surf);color:var(--ink)}
.login .e{color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:6px}
/* detail */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.ov.show{display:flex}
.dlg{background:var(--surf);border-radius:12px;width:100%;max-width:820px;overflow:hidden}
.dlg .hd{background:var(--pri);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.dlg .hd h2{margin:0;font-size:16px;flex:1}
.dlg .hd button{background:transparent;border:0;color:#cbd5e1;font-size:22px;cursor:pointer;line-height:1}
.dlg .bd{padding:14px}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 6px}
.txt{white-space:pre-wrap;line-height:1.45;background:var(--gry-bg);border-radius:8px;padding:9px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;font-size:13px}
.grid b{color:var(--mute);font-weight:600;display:block;font-size:11.5px}
.grid span{word-break:break-word}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots img{max-width:240px;max-height:170px;border:1px solid var(--bdr2);border-radius:7px;cursor:zoom-in;background:#fff}
pre.code{white-space:pre-wrap;word-break:break-all;font:11.5px/1.4 ui-monospace,Menlo,monospace;background:var(--gry-bg);border-radius:8px;padding:9px;max-height:240px;overflow:auto;margin:0}
.errs{display:flex;flex-direction:column;gap:4px}
.errs div{font:11.5px/1.35 ui-monospace,Menlo,monospace;background:var(--red-bg);color:var(--red);border-radius:6px;padding:5px 7px;word-break:break-word}
.hist{border-left:2px solid var(--bdr2);padding-left:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.manage{background:var(--acc-bg);border-radius:10px;padding:11px}
.manage .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.manage select,.manage textarea{border:1.5px solid var(--bdr2);border-radius:7px;padding:6px 8px;font:13px 'Barlow',sans-serif;background:var(--surf);color:var(--ink)}
.manage textarea{width:100%;min-height:60px;resize:vertical}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 15px;border-radius:9px;font-size:13px;z-index:40;display:none}
@media(max-width:600px){.wrap{padding:10px}.top h1{font-size:15px}.shots img{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">← Portal</a>
  <h1>💬 Laporan Bug &amp; Masukan</h1>
  <span class="who" id="who"></span>
  <button id="btn-logout" style="display:none" onclick="doLogout()">Keluar</button>
</div>

<div id="login-view" class="login" style="display:none">
  <h2>Masuk</h2>
  <p>Gunakan akun yang sama dengan Dashboard / Review &amp; Approval.</p>
  <input id="lg-user" placeholder="Username" autocomplete="username">
  <input id="lg-pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <div class="e" id="lg-err"></div>
  <button class="btn pri" style="width:100%" id="lg-btn" onclick="doLogin()">MASUK</button>
</div>

<div class="wrap" id="app" style="display:none">
  <div id="note"></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="f-q" placeholder="Cari judul, isi, halaman, pelapor, nomor FB-…" oninput="render()">
    <select id="f-status" onchange="render()"><option value="open">Status: belum selesai</option><option value="">Semua status</option></select>
    <select id="f-type" onchange="render()"><option value="">Semua jenis</option></select>
    <select id="f-prio" onchange="render()"><option value="">Semua prioritas</option></select>
    <select id="f-page" onchange="render()"><option value="">Semua halaman</option></select>
    <select id="f-sort" onchange="render()">
      <option value="new">Terbaru</option><option value="old">Terlama</option><option value="prio">Prioritas tertinggi</option>
    </select>
    <button class="btn" onclick="loadAll()">↻ Muat ulang</button>
    <button class="btn" onclick="copyMarkdown(filtered())" title="Salin daftar yang tampil sebagai teks untuk developer">📋 Salin untuk Developer</button>
    <button class="btn" onclick="exportCsv()">⬇️ CSV</button>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeDetail()"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
const COLL = 'feedback_reports';
const TYPES = { bug:'🐞 Bug / Error', kekurangan:'🧩 Kekurangan', saran:'💡 Saran / Fitur', tampilan:'🎨 Tampilan', lainnya:'❓ Lainnya' };
const PRIOS = { kritis:'Kritis', tinggi:'Tinggi', sedang:'Sedang', rendah:'Rendah' };
const PRIO_RANK = { kritis:0, tinggi:1, sedang:2, rendah:3 };
const STATUSES = { baru:'Baru', ditinjau:'Ditinjau', dikerjakan:'Dikerjakan', selesai:'Selesai', ditolak:'Ditolak' };
const OPEN_STATUSES = ['baru','ditinjau','dikerjakan'];
let ALL = [];
let ME = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ticket = r => 'FB-' + String(r.id || '').slice(0, 6).toUpperCase();
const fmt = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('id-ID', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const canManage = () => ME && (ME.role === 'admin' || ME.role === 'supervisor');
const canDelete = () => ME && ME.role === 'admin';
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600); }

// ── login (same account + hash as the dashboards) ──
async function hashPass(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function doLogin() {
  const user = document.getElementById('lg-user').value.trim().toLowerCase();
  const pass = document.getElementById('lg-pass').value;
  const err = document.getElementById('lg-err'), btn = document.getElementById('lg-btn');
  if (!user || !pass) { err.textContent = 'Isi username dan password.'; return; }
  btn.disabled = true; btn.textContent = 'Memverifikasi...'; err.textContent = '';
  try {
    const snap = await db.collection('dashboard_users').where('username', '==', user).limit(1).get();
    if (snap.empty) throw new Error('Username tidak ditemukan.');
    const d = snap.docs[0].data();
    if (d.password !== await hashPass(pass)) throw new Error('Password salah.');
    AuthSession.set({ user: d.username, role: d.role || '', name: d.name || d.username });
    start();
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false; btn.textContent = 'MASUK';
}
function doLogout() { AuthSession.clear(); location.reload(); }

function start() {
  ME = AuthSession.get();
  if (!ME) {
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    return;
  }
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('btn-logout').style.display = '';
  document.getElementById('who').textContent = ME.name + (ME.role ? ' · ' + ME.role : '') + (canManage() ? '' : ' (lihat saja)');
  AuthSession.onExpire(() => location.reload());
  loadAll();
}

// ── data ──
async function loadAll() {
  const note = document.getElementById('note');
  note.innerHTML = '';
  document.getElementById('list').innerHTML = '<div class="empty">Memuat laporan...</div>';
  try {
    const snap = await db.collection(COLL).orderBy('createdAt', 'desc').limit(1000).get();
    ALL = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  } catch (e) {
    ALL = [];
    note.innerHTML = '<div class="note err">Gagal memuat laporan: ' + esc(e.message) +
      (/permission/i.test(e.message) ? '<br>Aturan Firestore untuk koleksi <b>feedback_reports</b> belum di-deploy.' : '') + '</div>';
  }
  fillFilters();
  render();
  const id = new URLSearchParams(location.search).get('id');
  if (id && ALL.some(r => r.id === id)) openDetail(id);
}
function fillFilters() {
  const fill = (id, map, keepFirst) => {
    const el = document.getElementById(id), cur = el.value;
    const first = Array.from(el.options).slice(0, keepFirst).map(o => o.outerHTML).join('');
    el.innerHTML = first + Object.entries(map).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
    el.value = cur;
  };
  fill('f-status', STATUSES, 2);
  fill('f-type', TYPES, 1);
  fill('f-prio', PRIOS, 1);
  const pages = {};
  ALL.forEach(r => { const f = r.page && r.page.file; if (f) pages[f] = (r.page.title ? r.page.title + ' — ' : '') + f; });
  fill('f-page', Object.fromEntries(Object.entries(pages).sort((a, b) => a[1].localeCompare(b[1]))), 1);
}
function filtered() {
  const q = document.getElementById('f-q').value.trim().toLowerCase();
  const st = document.getElementById('f-status').value, ty = document.getElementById('f-type').value;
  const pr = document.getElementById('f-prio').value, pg = document.getElementById('f-page').value;
  const so = document.getElementById('f-sort').value;
  let out = ALL.filter(r => {
    if (st === 'open' ? !OPEN_STATUSES.includes(r.status) : (st && r.status !== st)) return false;
    if (ty && r.type !== ty) return false;
    if (pr && r.priority !== pr) return false;
    if (pg && !(r.page && r.page.file === pg)) return false;
    if (q) {
      const hay = [ticket(r), r.title, r.description, r.steps, r.devNote, r.reporter && r.reporter.name, r.page && r.page.title, r.page && r.page.file].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  out.sort((a, b) => so === 'old' ? (a.createdAt || '').localeCompare(b.createdAt || '')
    : so === 'prio' ? ((PRIO_RANK[a.priority] ?? 9) - (PRIO_RANK[b.priority] ?? 9)) || (b.createdAt || '').localeCompare(a.createdAt || '')
    : (b.createdAt || '').localeCompare(a.createdAt || ''));
  return out;
}

// ── render ──
function statClick(filter) {
  document.getElementById('f-status').value = filter.status ?? document.getElementById('f-status').value;
  if ('type' in filter) document.getElementById('f-type').value = filter.type;
  if ('prio' in filter) document.getElementById('f-prio').value = filter.prio;
  render();
}
function renderStats() {
  const n = f => ALL.filter(f).length;
  const s = [
    ['Total laporan', ALL.length, "{status:'',type:'',prio:''}"],
    ['Baru', n(r => r.status === 'baru'), "{status:'baru'}"],
    ['Dikerjakan', n(r => r.status === 'dikerjakan'), "{status:'dikerjakan'}"],
    ['Selesai', n(r => r.status === 'selesai'), "{status:'selesai'}"],
    ['Bug terbuka', n(r => r.type === 'bug' && OPEN_STATUSES.includes(r.status)), "{status:'open',type:'bug'}"],
    ['Kritis terbuka', n(r => r.priority === 'kritis' && OPEN_STATUSES.includes(r.status)), "{status:'open',prio:'kritis'}"],
  ];
  document.getElementById('stats').innerHTML = s.map(([l, v, f]) => `<div class="stat" onclick="statClick(${f})"><div class="n">${v}</div><div class="l">${l}</div></div>`).join('');
}
function badges(r) {
  return `<span class="tag code">${ticket(r)}</span>
    <span class="tag s-${esc(r.status)}">${esc(STATUSES[r.status] || r.status)}</span>
    <span class="tag">${esc(TYPES[r.type] || r.type)}</span>
    <span class="tag pr-${esc(r.priority)}">${esc(PRIOS[r.priority] || r.priority || '—')}</span>`;
}
function render() {
  renderStats();
  const list = filtered();
  document.getElementById('count').textContent = `Menampilkan ${list.length} dari ${ALL.length} laporan`;
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">Tidak ada laporan untuk filter ini.</div>'; return; }
  el.innerHTML = list.map(r => `
    <div class="card p-${esc(r.priority)}" onclick="openDetail('${esc(r.id)}')">
      <div class="tags">${badges(r)}</div>
      <div class="t">${esc(r.title)}</div>
      <div class="m">
        <span>📄 ${esc((r.page && (r.page.title || r.page.file)) || '—')}</span>
        <span>👤 ${esc((r.reporter && r.reporter.name) || 'Anonim')}</span>
        <span>🕒 ${fmt(r.createdAt)}</span>
        ${(r.consoleErrors || []).length ? `<span style="color:var(--red)">⚠️ ${r.consoleErrors.length} error</span>` : ''}
        ${(r.screenshots || []).length ? `<span>🖼 ${r.screenshots.length}</span>` : ''}
      </div>
    </div>`).join('');
}

// ── detail ──
function openDetail(id) {
  const r = ALL.find(x => x.id === id);
  if (!r) return;
  const env = r.env || {}, pg = r.page || {}, rep = r.reporter || {};
  const hist = (r.history || []).slice().reverse();
  document.getElementById('dlg').innerHTML = `
    <div class="hd"><h2>${esc(r.title)}<div class="tags" style="margin-top:6px">${badges(r)}</div></h2><button onclick="closeDetail()" title="Tutup">×</button></div>
    <div class="bd">
      <div class="sec"><h3>Penjelasan</h3><div class="txt">${esc(r.description || '—')}</div></div>
      ${r.steps ? `<div class="sec"><h3>Langkah untuk mengulang</h3><div class="txt">${esc(r.steps)}</div></div>` : ''}
      ${(r.screenshots || []).length ? `<div class="sec"><h3>Screenshot</h3><div class="shots">${r.screenshots.map((s, i) => `<img src="${s.dataUrl}" alt="screenshot ${i + 1}" onclick="openImg('${esc(r.id)}',${i})">`).join('')}</div></div>` : ''}
      <div class="sec"><h3>Info</h3><div class="grid">
        <div><b>Pelapor</b><span>${esc(rep.name || 'Anonim')}${rep.role ? ' (' + esc(rep.role) + ')' : ''}</span></div>
        <div><b>Kontak</b><span>${esc(rep.contact || '—')}</span></div>
        <div><b>Dilaporkan</b><span>${fmt(r.createdAt)}</span></div>
        <div><b>Terakhir diubah</b><span>${fmt(r.updatedAt)}</span></div>
        <div><b>Halaman</b><span>${esc(pg.title || '—')}<br><a href="${esc(pg.url || '#')}" target="_blank" rel="noopener">${esc(pg.file || pg.path || '')}</a></span></div>
        <div><b>Browser</b><span>${esc(env.userAgent || '—')}</span></div>
        <div><b>Layar</b><span>${esc(env.viewport || '—')} · ${esc(env.screen || '')}</span></div>
        <div><b>Versi app / online</b><span>${esc(env.appVersion || '—')} · ${env.online === false ? 'offline' : 'online'}</span></div>
      </div></div>
      ${(r.consoleErrors || []).length ? `<div class="sec"><h3>Error di halaman (${r.consoleErrors.length})</h3><div class="errs">${r.consoleErrors.map(e => `<div>[${esc(e.kind)}] ${esc(e.msg)}${e.n > 1 ? ' ×' + e.n : ''}<br><span style="opacity:.7">${fmt(e.at)}</span></div>`).join('')}</div></div>` : ''}
      ${r.devNote ? `<div class="sec"><h3>Catatan developer</h3><div class="txt">${esc(r.devNote)}</div></div>` : ''}
      <div class="sec"><h3>Riwayat</h3><div class="hist">${hist.map(h => `<div><span class="tag s-${esc(h.status)}">${esc(STATUSES[h.status] || h.status)}</span> ${esc(h.by || '')} · ${fmt(h.at)}${h.note ? '<br>' + esc(h.note) : ''}</div>`).join('') || '—'}</div></div>
      ${canManage() ? `<div class="sec manage"><h3>Tindak lanjut</h3>
        <div class="row"><label>Status
          <select id="m-status">${Object.entries(STATUSES).map(([v, l]) => `<option value="${v}"${v === r.status ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
          <label>Prioritas <select id="m-prio">${Object.entries(PRIOS).map(([v, l]) => `<option value="${v}"${v === r.priority ? ' selected' : ''}>${l}</option>`).join('')}</select></label></div>
        <textarea id="m-note" placeholder="Catatan developer (mis. penyebab, versi perbaikan, commit)">${esc(r.devNote || '')}</textarea>
        <div class="row" style="margin:8px 0 0">
          <button class="btn pri" onclick="saveManage('${esc(r.id)}')">Simpan</button>
          <button class="btn" onclick="copyMarkdown([ALL.find(x=>x.id==='${esc(r.id)}')])">📋 Salin untuk Developer</button>
          ${canDelete() ? `<button class="btn danger" onclick="deleteReport('${esc(r.id)}')">Hapus</button>` : ''}
        </div></div>`
      : `<div class="sec"><button class="btn" onclick="copyMarkdown([ALL.find(x=>x.id==='${esc(r.id)}')])">📋 Salin untuk Developer</button></div>`}
      <details class="sec"><summary style="cursor:pointer;color:var(--mute);font-size:12.5px">Data teknis lengkap (JSON)</summary>
        <pre class="code">${esc(JSON.stringify(Object.assign({}, r, { screenshots: (r.screenshots || []).map(s => ({ w: s.w, h: s.h, name: s.name })) }), null, 2))}</pre></details>
    </div>`;
  document.getElementById('ov').classList.add('show');
  history.replaceState(null, '', '?id=' + encodeURIComponent(id));
}
function closeDetail() {
  document.getElementById('ov').classList.remove('show');
  history.replaceState(null, '', location.pathname);
}
function openImg(id, i) {
  const r = ALL.find(x => x.id === id);
  const s = r && r.screenshots && r.screenshots[i];
  if (!s) return;
  const w = window.open('', '_blank');
  if (w) w.document.write('<title>Screenshot</title><body style="margin:0;background:#111;display:flex;justify-content:center"><img src="' + s.dataUrl + '" style="max-width:100%"></body>');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

async function saveManage(id) {
  if (!canManage()) return;
  const r = ALL.find(x => x.id === id);
  const status = document.getElementById('m-status').value;
  const priority = document.getElementById('m-prio').value;
  const devNote = document.getElementById('m-note').value.trim();
  const now = new Date().toISOString();
  const changes = [];
  if (status !== r.status) changes.push('status → ' + STATUSES[status]);
  if (priority !== r.priority) changes.push('prioritas → ' + PRIOS[priority]);
  if (devNote !== (r.devNote || '')) changes.push('catatan diperbarui');
  if (!changes.length) { toast('Tidak ada perubahan.'); return; }
  const entry = { status, by: ME.name, at: now, note: changes.join(', ') };
  const patch = { status, priority, devNote, updatedAt: now, history: (r.history || []).concat([entry]) };
  try {
    await db.collection(COLL).doc(id).update(patch);
    Object.assign(r, patch);
    render(); openDetail(id); toast('Tersimpan.');
  } catch (e) { alert('Gagal menyimpan: ' + e.message); }
}
async function deleteReport(id) {
  if (!canDelete()) return;
  const r = ALL.find(x => x.id === id);
  if (!confirm('Hapus laporan ' + ticket(r) + ' "' + r.title + '"? Tidak bisa dibatalkan.')) return;
  try {
    await db.collection(COLL).doc(id).delete();
    ALL = ALL.filter(x => x.id !== id);
    closeDetail(); render(); toast('Laporan dihapus.');
  } catch (e) { alert('Gagal menghapus: ' + e.message); }
}

// ── export ──
function toMarkdown(list) {
  return list.map(r => {
    const pg = r.page || {}, env = r.env || {};
    const lines = [
      `## ${ticket(r)} — ${r.title}`,
      `- Jenis: ${TYPES[r.type] || r.type} · Prioritas: ${PRIOS[r.priority] || r.priority} · Status: ${STATUSES[r.status] || r.status}`,
      `- Halaman: ${pg.title || ''} (${pg.file || pg.path || ''})`,
      `- Pelapor: ${(r.reporter && r.reporter.name) || 'Anonim'} · ${fmt(r.createdAt)}`,
      env.userAgent ? `- Browser: ${env.userAgent} · layar ${env.viewport || ''} · versi ${env.appVersion || '—'}` : '',
      '', '**Penjelasan:**', r.description || '—',
      r.steps ? '\n**Langkah untuk mengulang:**\n' + r.steps : '',
      (r.consoleErrors || []).length ? '\n**Error di halaman:**\n' + r.consoleErrors.map(e => `- [${e.kind}] ${e.msg}`).join('\n') : '',
      (r.screenshots || []).length ? `\n(${r.screenshots.length} screenshot — lihat Feedback_Reports.html?id=${r.id})` : '',
      r.devNote ? '\n**Catatan developer:** ' + r.devNote : '',
    ];
    return lines.filter(l => l !== '').join('\n');
  }).join('\n\n---\n\n');
}
async function copyMarkdown(list) {
  list = (list || []).filter(Boolean);
  if (!list.length) { toast('Tidak ada laporan untuk disalin.'); return; }
  const md = toMarkdown(list);
  try { await navigator.clipboard.writeText(md); toast(list.length + ' laporan disalin.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = md; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(list.length + ' laporan disalin.'); } catch (_) { alert(md); }
    ta.remove();
  }
}
function exportCsv() {
  const list = filtered();
  const cols = [['No', r => ticket(r)], ['Tanggal', r => r.createdAt], ['Status', r => STATUSES[r.status] || r.status],
    ['Jenis', r => r.type], ['Prioritas', r => r.priority], ['Judul', r => r.title], ['Penjelasan', r => r.description],
    ['Langkah', r => r.steps], ['Halaman', r => r.page && r.page.file], ['Pelapor', r => r.reporter && r.reporter.name],
    ['Kontak', r => r.reporter && r.reporter.contact], ['Jumlah error', r => (r.consoleErrors || []).length],
    ['Screenshot', r => (r.screenshots || []).length], ['Catatan developer', r => r.devNote], ['Diubah', r => r.updatedAt]];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '﻿' + [cols.map(c => cell(c[0])).join(',')].concat(list.map(r => cols.map(c => cell(c[1](r))).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'laporan-bug-masukan-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

start();
</script>
